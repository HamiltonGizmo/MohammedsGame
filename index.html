<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1220;--panel:#111b2c;--panel2:#16233a;--line:#25344f;--gold:#d4af37;--gold2:#f0d27a;--blue:#5b8def;--text:#e8e6df;--muted:#8b97ad;--red:#ef4444;--green:#4ade80;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--gold2)}
.muted{color:var(--muted)} .pos{color:var(--green)} .neg{color:#f87171} .red{color:#f87171} .gold{color:var(--gold2)} .small{font-size:12px}
/* ---------- HUB ---------- */
#hub{height:100%;overflow-y:auto;background:radial-gradient(ellipse at 20% -10%,#1d3358 0%,transparent 55%),radial-gradient(ellipse at 100% 0%,#3a2a12 0%,transparent 45%),var(--bg)}
.hnav{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid rgba(212,175,55,.15)}
.logo{font-family:Cinzel,serif;font-weight:800;font-size:22px;letter-spacing:.08em;color:var(--gold2);display:flex;align-items:center;gap:10px}
.logo i{font-style:normal;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8a6a1c);color:#1a1205;font-size:18px}
.hnav span{color:var(--muted);font-size:13px}
.hero{padding:clamp(28px,6vw,72px) clamp(16px,4vw,48px) 24px;max-width:1100px;margin:0 auto}
.hero h1{font-family:Cinzel,serif;font-size:clamp(30px,6vw,56px);margin:0 0 10px;line-height:1.05;background:linear-gradient(180deg,#fff7dc,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#b8c2d6;font-size:clamp(14px,2vw,17px);max-width:620px;margin:0}
#hubGames{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:12px clamp(16px,4vw,48px) 60px;max-width:1100px;margin:0 auto}
.gcard{display:flex;flex-direction:column;background:linear-gradient(180deg,#131f33,#0f1828);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
a.gcard:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 18px 40px -18px rgba(212,175,55,.45)}
.gart{height:170px;position:relative;overflow:hidden}
.gart.wd{background:radial-gradient(circle at 70% 120%,#1c4d7a,#0b1a2e 70%)}
.globe{position:absolute;width:210px;height:210px;border-radius:50%;left:50%;top:22px;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#3fa37a 0 12%,transparent 13%),radial-gradient(circle at 60% 45%,#d0a24a 0 15%,transparent 16%),radial-gradient(circle at 30% 65%,#c9463d 0 10%,transparent 11%),radial-gradient(circle at 75% 25%,#3d5a9e 0 9%,transparent 10%),radial-gradient(circle at 50% 50%,#1f5f8f,#0a2540);box-shadow:inset -30px -20px 60px rgba(0,0,0,.6),0 0 60px rgba(91,141,239,.35);animation:spin 18s linear infinite}
@keyframes spin{from{background-position:0 0}to{background-position:420px 0}}
.gbadge{position:absolute;top:12px;left:12px;background:var(--gold);color:#1a1205;font-weight:700;font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.06em}
.soonart{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#111a2b 0 14px,#0f1726 14px 28px);font-size:48px;opacity:.7}
.gbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.gbody small{color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600}
.gbody h3{margin:0;font-family:Cinzel,serif;font-size:22px}
.gbody p{margin:0;color:#aab5c8;line-height:1.45}
.gtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.gtags span{font-size:11px;padding:3px 8px;border-radius:20px;background:#1b2a44;color:#c3cde0}
.gplay{margin-top:auto;padding-top:12px;color:var(--gold2);font-weight:600}
.gcard.soon{opacity:.6}
.hfoot{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
/* ---------- GAME (v2) ---------- */
#game{position:fixed;inset:0;display:none;--glass:rgba(13,21,37,.86);--glass2:rgba(22,33,56,.9);--edge:rgba(212,175,55,.28);--r:16px;--dockH:76px}
.pos{color:#4ade80}.neg{color:#f87171}.center{text-align:center}
/* menu */
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 14px 20px;background:radial-gradient(circle at 50% 120%,rgba(63,163,122,.25),transparent 55%),radial-gradient(circle at 20% -10%,#22406e,transparent 55%),radial-gradient(circle at 90% 10%,rgba(212,175,55,.18),transparent 40%),#070d18}
#menu::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 44px);pointer-events:none}
.mwrap{position:relative;width:min(520px,100%);text-align:center}
.mtitle{font-family:Cinzel,serif;font-weight:800;font-size:clamp(28px,7vw,52px);letter-spacing:.06em;margin:0;background:linear-gradient(180deg,#fff7dc,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 20px rgba(212,175,55,.35))}
.msub{color:var(--gold);letter-spacing:.4em;font-size:12px;margin:6px 0 22px;font-weight:700}
#menuBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(28,42,70,.9),rgba(15,24,40,.9));font-weight:700;font-size:14px;text-align:center;transition:.15s;min-height:84px}
.mbtn:hover{transform:translateY(-2px);border-color:var(--gold)}
.mbtn .mi{font-size:28px;line-height:1}
.mbtn small{color:var(--muted);font-weight:500;font-size:11px}
.mbtn.gold{grid-column:1/-1;background:linear-gradient(180deg,#f0d27a,#b38d22);color:#1a1205;border-color:#f6dd8d;font-size:19px;min-height:70px;flex-direction:row;box-shadow:0 10px 30px -10px rgba(212,175,55,.6)}
.mbtn.gold .mi{font-size:26px}.mbtn.gold small{color:rgba(26,18,5,.7)}.mbtn>span:last-child{line-height:1.25}
.mbtn.ghost{grid-column:1/-1;background:transparent;min-height:50px;flex-direction:row}
.loading{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px;color:var(--muted)}
.spin{width:40px;height:40px;border:3px solid #26364f;border-top-color:var(--gold);border-radius:50%;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.err{grid-column:1/-1;background:#2a1416;border:1px solid #5b2226;border-radius:12px;padding:14px;text-align:left}
#mapsrc{color:#5d6a82;font-size:11px;margin-top:16px}
#play{position:absolute;inset:0;display:none}
#mapwrap{position:absolute;inset:0}
#map{display:block;touch-action:none;cursor:grab}#map:active{cursor:grabbing}
/* top bar */
#topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));background:linear-gradient(180deg,rgba(6,11,21,.95),rgba(6,11,21,.55) 80%,transparent);z-index:20;pointer-events:none}
#topbar>*{pointer-events:auto}
.tb-left{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-nation{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:5px 12px 5px 6px;font-family:Cinzel,serif;font-weight:700;font-size:14px;color:var(--gold2);max-width:230px;backdrop-filter:blur(10px)}
.tb-nation .flag{border-radius:50%;width:30px;height:30px}
.tb-nation span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-time{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:4px 12px 4px 4px;backdrop-filter:blur(10px)}
.tb-time b{font-size:13px;white-space:nowrap;display:block}
.playbtn{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(180deg,#f0d27a,#b38d22);color:#1a1205;font-size:15px;font-weight:900;box-shadow:0 0 0 3px rgba(212,175,55,.2)}
.playbtn.paused{background:linear-gradient(180deg,#4ade80,#15803d);color:#fff;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(74,222,128,.25)}}
.spd2{display:flex;gap:2px;margin-top:2px}.spd2 button{background:rgba(255,255,255,.06);border:0;border-radius:6px;font-size:10px;padding:1px 5px;color:#9fb0cc}.spd2 button.on{background:var(--gold);color:#1a1205;font-weight:700}
.tb-stats{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.tb-stats::-webkit-scrollbar{display:none}
.chip2{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid rgba(255,255,255,.07);border-radius:999px;padding:4px 12px 4px 4px;flex-shrink:0;backdrop-filter:blur(10px)}
.chip2:hover{border-color:var(--gold)}
.chip2 i{font-style:normal;font-size:16px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.07)}
.chip2 span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.chip2 em{font-style:normal;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#8b97ad}
.chip2 b{font-size:13px}.chip2 small{font-size:9.5px}
.tb-war{display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,#b91c1c,#7f1d1d);border:1px solid #ef4444;border-radius:999px;padding:6px 12px;font-weight:800;flex-shrink:0;animation:pulse 2s infinite}
.tb-war small{font-size:12px}
@keyframes pulse{50%{box-shadow:0 0 16px rgba(239,68,68,.7)}}
.tb-menu{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--edge);font-size:17px;flex-shrink:0}
/* dock */
#bottomnav{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;background:var(--glass);border:1px solid var(--edge);border-radius:22px;z-index:20;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none;box-shadow:0 14px 40px rgba(0,0,0,.55);backdrop-filter:blur(14px)}
#bottomnav::-webkit-scrollbar{display:none}
#bottomnav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:16px;padding:5px 6px;font-size:21px;min-width:62px;flex-shrink:0;transition:.15s}
#bottomnav button span{font-size:10px;color:#a7b3c9;font-weight:700}
#bottomnav button:hover{background:rgba(255,255,255,.06)}
#bottomnav button.on{background:linear-gradient(180deg,rgba(212,175,55,.3),rgba(212,175,55,.08))}
#bottomnav button.on span{color:var(--gold2)}
.advbtn .badge{position:absolute;top:0;right:8px;background:#ef4444;color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:9px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
/* map controls */
#mapctl{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(70px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:15}
#mapctl button{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.08);font-size:18px;backdrop-filter:blur(10px)}
#mapctl button:hover{border-color:var(--gold)}
#modelabel{position:absolute;right:calc(62px + env(safe-area-inset-right));top:calc(80px + env(safe-area-inset-top));font-size:11px;color:var(--gold2);background:var(--glass);padding:4px 10px;border-radius:999px;z-index:15;pointer-events:none}
#modes{position:absolute;right:calc(62px + env(safe-area-inset-right));top:calc(108px + env(safe-area-inset-top));display:none;grid-template-columns:1fr 1fr;gap:4px;background:var(--glass2);border:1px solid var(--edge);border-radius:16px;padding:6px;z-index:25;width:280px;backdrop-filter:blur(14px)}
#modes.show{display:grid}
#modes button{background:rgba(255,255,255,.04);border:0;text-align:left;padding:9px 10px;border-radius:10px;font-size:12.5px}
#modes button:hover,#modes button.on{background:rgba(212,175,55,.2);color:var(--gold2)}
#mini{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:calc(var(--dockH) + 14px);width:200px;height:92px;border:1px solid var(--edge);border-radius:12px;z-index:15;cursor:pointer;background:#0b1a2e}
/* panel */
#panel{position:absolute;top:calc(64px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right));bottom:calc(var(--dockH) + 14px);width:min(430px,calc(100% - 80px));background:var(--glass);border:1px solid var(--edge);border-radius:22px;z-index:18;display:none;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6);backdrop-filter:blur(16px);overflow:hidden}
#panel.show{display:flex;animation:pin .22s ease}
@keyframes pin{from{opacity:0;transform:translateY(10px)}}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(212,175,55,.12),transparent)}
.ptitle{font-family:Cinzel,serif;font-weight:700;font-size:17px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead button{background:rgba(255,255,255,.07);border:0;border-radius:50%;width:34px;height:34px;font-size:15px}
.pbody{overflow-y:auto;padding:12px 14px 20px;flex:1;overscroll-behavior:contain}
.pbody h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.pbody h2,.pbody h3{margin:0}
/* shared components */
.flag{width:24px;height:16px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.4);vertical-align:middle;flex-shrink:0}
.flag.big{width:36px;height:24px}.flag.huge{width:66px;height:44px;border-radius:6px}
.hero2{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(30,46,78,.6));border:1px solid var(--edge);margin-bottom:10px}
.hero2[data-a]{cursor:pointer}
.hic{font-size:34px;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:rgba(0,0,0,.25);flex-shrink:0}
.htx{flex:1;min-width:0;display:flex;flex-direction:column}.htx b{font-size:22px;font-weight:800}.htx small{color:#c3cbd9;font-size:12.5px}
.hero2 .go{font-size:26px;color:var(--gold)}
.bubs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.bubs.four{grid-template-columns:repeat(4,1fr)}
.bub{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);text-align:center;min-width:0}
.bub .bi{font-size:22px}.bub b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.bub small{font-size:10px;color:var(--muted);line-height:1.2}.bub.neg b{color:#f87171}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:10px 12px;margin:10px 0}
.card .ch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin:4px 0 6px}.card .ch b{margin-left:auto}
.flow{margin-bottom:8px}.fbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05)}.fbar i{display:block;height:100%}
.fleg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font-size:11.5px;color:#cbd5e1}.fleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.mood{font-size:24px;margin-left:6px}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold);height:26px}
.sech{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:14px;margin:16px 0 8px;color:#f3ead1}.sech small{font-weight:500;color:var(--muted);font-size:11.5px}.sech.center{justify-content:center;font-family:Cinzel,serif;color:var(--gold2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 9px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);text-align:center;transition:.12s;min-width:0}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile .bi{font-size:28px;line-height:1.15}.tile b{font-size:12px;line-height:1.2}.tile small{font-size:10.5px;color:var(--muted)}.tile em{font-style:normal;font-size:10px;color:#fca5a5;line-height:1.2}
.tile.dis{opacity:.5}.tile.dis:hover{transform:none}.tile.ro{cursor:default}.tile.ro:hover{transform:none;border-color:rgba(255,255,255,.08)}
.tile.cur{border-color:var(--gold);background:linear-gradient(180deg,rgba(212,175,55,.25),rgba(212,175,55,.05))}
.tiles.dec2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.tile.big{align-items:flex-start;text-align:left;padding:12px}.tile.big small{line-height:1.3}.tile.big em{color:var(--gold2);margin-top:4px;font-size:11px}.tile.big.dis em{color:#fca5a5}
.tiles.terr{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
.stars{color:var(--gold2);letter-spacing:1px}.stars i{color:#475569;font-style:normal}
.tiles.units{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.uimg{width:20px;height:20px;vertical-align:middle;background:#1c2a44;border-radius:6px;padding:1px}.uimg.sm{width:22px;height:22px;background:none}.uimg.big{width:38px;height:38px}.uimg.huge{width:52px;height:52px;border-radius:14px;padding:5px;background:radial-gradient(circle,#2b3f66,#16233a)}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.04);border-radius:14px;padding:4px;margin:6px 0 10px;overflow-x:auto;scrollbar-width:none}.seg.wrap{flex-wrap:wrap}
.seg button{flex:1 0 auto;background:none;border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:12.5px;color:#b8c2d6;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,#f0d27a,#b38d22);color:#1a1205}
.law2 button{flex-direction:column;gap:2px;font-size:11.5px}.law2 button span{font-size:20px}
.qchips{display:flex;flex-direction:column;gap:6px;margin:8px 0}.qchip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:14px;background:rgba(255,255,255,.04)}.qchip>span:not(.ring){flex:1;display:flex;flex-direction:column}.qchip b{font-size:12.5px}.qchip small{font-size:11px;color:var(--muted)}
.ring{position:relative;display:inline-grid;place-items:center;flex-shrink:0}.ring svg{position:absolute;inset:0}.ring .rin{position:relative;display:grid;place-items:center;font-size:17px;line-height:1}.ring .rin b{font-size:14px}
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}.rtile{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 5px;border-radius:14px;background:rgba(255,255,255,.04);text-align:center}.rtile .bi{font-size:24px}.rtile b{font-size:13px}.rtile small{font-size:10px;color:var(--muted)}.rtile em{font-style:normal;font-size:10.5px}
.rtiles.big{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}.rtile .bs{display:flex;gap:4px;margin-top:4px}.rtile .bs button{border:0;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;background:#1d4ed8}.rtile .bs button+button{background:#15803d}.rtile em{color:var(--muted)}
.acard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px 8px 8px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin:6px 0}
.acard:hover{border-color:var(--gold)}

.ttg{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.ttg span{color:var(--muted)}
#toasts{position:absolute;top:calc(64px + env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:6px;z-index:30;width:min(340px,calc(100% - 80px));pointer-events:none}
.toast{pointer-events:auto;background:var(--glass2);border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--blue);border-radius:14px;padding:9px 12px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .3s ease;transition:opacity .5s,transform .5s;backdrop-filter:blur(10px)}
.toast.good{border-left-color:#4ade80}.toast.bad{border-left-color:#ef4444}.toast.war{border-left-color:#ef4444;background:rgba(80,14,14,.95)}.toast.news{border-left-color:var(--gold)}
.toast.out{opacity:0;transform:translateX(-20px)}@keyframes tin{from{opacity:0;transform:translateX(-20px)}}
#modal{position:fixed;inset:0;background:rgba(3,6,12,.7);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));backdrop-filter:blur(4px)}
#modal.show{display:flex}
.mbox{width:min(470px,100%);max-height:88vh;max-height:88dvh;overflow-y:auto;background:linear-gradient(180deg,#17253f,#0f1828);border:1px solid var(--edge);border-radius:22px;padding:18px 18px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pin .2s ease}
.mbox.wide{width:min(580px,100%)}
.mbox h3{margin:0 0 8px;font-family:Cinzel,serif;color:var(--gold2)}.mbox h4{margin:12px 0 6px;font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.07em}
.evh{font-family:Cinzel,serif;font-size:20px;color:var(--gold2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.evh small{font-family:Inter;font-size:11px;color:var(--muted)}
.mbox p{line-height:1.5;color:#ccd4e2}
.evopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}.evopts .btn{padding:12px}
/* nation selection */
#selbar{display:none}
#play.choosing #selbar{display:flex;flex-direction:column;gap:8px;position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:min(420px,calc(100% - 80px));max-height:calc(100% - 20px);overflow-y:auto;z-index:20;background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:14px;backdrop-filter:blur(14px)}
#play.choosing #mini,#play.choosing #toasts,#play.choosing #mapctl,#play.choosing #modelabel{display:none}
.selh{display:flex;flex-direction:column}.selh b{font-family:Cinzel,serif;font-size:21px;color:var(--gold2)}.selh small{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.quick button,.nrb{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:8px 4px;font-size:10.5px;text-align:center}
.quick button .flag{width:40px;height:27px}.quick button:hover,.nrb:hover{border-color:var(--gold)}.quick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nrb{flex-direction:row;font-size:12px;padding:6px 10px}
#nres{display:flex;flex-wrap:wrap;gap:4px}
.pv{display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(30,46,78,.5));border:1px solid var(--edge);border-radius:18px;padding:12px}
.pvh{display:flex;align-items:center;gap:12px}.pvh h2{margin:0;font-family:Cinzel,serif;font-size:21px;color:var(--gold2)}
/* formation anim */
#formanim{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(40,30,5,.85),rgba(0,0,0,.92));pointer-events:none}
#formanim.show{display:flex}
.fa-in{text-align:center;animation:fa 4.2s ease forwards;padding:20px}.fa-in img{width:min(320px,70vw);aspect-ratio:3/2;border-radius:10px;box-shadow:0 0 80px rgba(212,175,55,.7);animation:fz 1.4s cubic-bezier(.2,1.4,.4,1)}
.fa-in h1{font-family:Cinzel,serif;font-size:clamp(26px,6vw,52px);color:var(--gold2);margin:18px 0 6px;text-shadow:0 0 30px rgba(212,175,55,.6)}.fa-in p{color:#e8e0c8;max-width:520px;margin:0 auto}.fa-in small{color:var(--gold);display:block;margin-top:8px}
@keyframes fz{from{transform:scale(.2) rotate(-8deg);opacity:0}}@keyframes fa{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
#play.spect #bottomnav button:not([data-v^=world]):not([data-v=formables]){display:none}

/* ===== Tablet (iPad portrait & small laptops) ===== */
@media (max-width:1024px) and (min-width:721px){
  .chip2 em{display:none}
  .tb-nation span{max-width:120px}
  #panel{width:min(400px,calc(100% - 76px))}
}
/* ===== Phone portrait ===== */
@media (max-width:720px) and (orientation:portrait){
  #game{--dockH:68px}
  #topbar{flex-wrap:wrap;gap:6px;padding-bottom:4px}
  .tb-left{flex:1;min-width:0}
  .tb-nation{padding:4px;max-width:none}.tb-nation span{display:none}
  .tb-time{flex:1;min-width:0}
  .tb-stats{order:5;flex:1 1 100%}
  .chip2 em{display:none}.chip2{padding:3px 10px 3px 3px}.chip2 i{width:26px;height:26px;font-size:14px}
  .tb-war{padding:6px 10px}
  #bottomnav{left:0;right:0;transform:none;bottom:0;max-width:none;border-radius:20px 20px 0 0;padding:5px 6px max(6px,env(safe-area-inset-bottom));justify-content:space-between;border-bottom:0}
  #bottomnav button{flex:1 1 0;min-width:0;font-size:19px;padding:4px 0}
  #bottomnav button span{font-size:8.5px;white-space:nowrap}
  #panel{left:0;right:0;width:auto;top:auto;bottom:calc(var(--dockH) + env(safe-area-inset-bottom));height:60vh;height:60dvh;border-radius:22px 22px 0 0;border-bottom:0}
  #panel[data-kind=army]{height:40vh;height:40dvh}
  #panel::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(255,255,255,.25)}
  #mini{display:none}
  #mapctl{top:auto;bottom:calc(var(--dockH) + 12px + env(safe-area-inset-bottom));right:8px}
  #mapctl button{width:40px;height:40px}
  #panel.show ~ #mapctl,#panel.show ~ #modelabel{display:none}
  #modelabel{top:auto;bottom:calc(var(--dockH) + 12px + env(safe-area-inset-bottom));right:56px}
  #modes{top:auto;bottom:calc(var(--dockH) + 46px + env(safe-area-inset-bottom));right:8px;width:calc(100% - 16px)}
  #toasts{top:auto;bottom:calc(var(--dockH) + 64px + env(safe-area-inset-bottom));width:calc(100% - 70px)}
  #panel.show ~ #toasts{bottom:calc(60dvh + var(--dockH) + 8px)}
  #panel.show[data-kind=army] ~ #toasts{bottom:calc(40dvh + var(--dockH) + 8px)}
  .bubs.four{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  #play.choosing #selbar{top:auto;bottom:0;left:0;right:0;width:auto;max-height:58vh;max-height:58dvh;border-radius:22px 22px 0 0;padding-bottom:max(14px,env(safe-area-inset-bottom))}
  #menuBtns{grid-template-columns:1fr 1fr}
}
/* ===== Phone landscape ===== */
@media (orientation:landscape) and (max-height:540px){
  #game{--dockH:0px;--rail:74px}
  #topbar{padding-top:max(5px,env(safe-area-inset-top));padding-bottom:5px;padding-left:calc(var(--rail) + max(8px,env(safe-area-inset-left)))}
  .tb-nation span{display:none}.tb-nation{padding:3px}
  .tb-nation .flag{width:28px;height:28px}
  .playbtn{width:32px;height:32px}
  .chip2 em{display:none}.chip2{padding:2px 9px 2px 2px}.chip2 i{width:26px;height:26px;font-size:14px}
  .tb-menu{width:34px;height:34px}
  #bottomnav{left:max(6px,env(safe-area-inset-left));top:6px;bottom:6px;transform:none;flex-direction:column;max-width:none;max-height:none;width:var(--rail);overflow-y:auto;overflow-x:hidden;border-radius:20px;padding:5px 4px;justify-content:flex-start}
  #bottomnav button{min-width:0;width:100%;font-size:18px;padding:5px 0}
  #bottomnav button span{font-size:8.5px}
  #panel{top:calc(50px + env(safe-area-inset-top));bottom:6px;right:max(6px,env(safe-area-inset-right));width:min(420px,50vw);height:auto;border-radius:20px}
  #mini{display:none}
  #mapctl{top:auto;bottom:8px;right:max(8px,env(safe-area-inset-right));flex-direction:row}
  #mapctl button{width:38px;height:38px}
  #panel.show ~ #mapctl,#panel.show ~ #modelabel{display:none}
  #modelabel{top:auto;bottom:54px;right:max(8px,env(safe-area-inset-right))}
  #modes{top:auto;bottom:54px;right:8px}
  #toasts{top:auto;bottom:8px;left:calc(var(--rail) + max(14px,env(safe-area-inset-left)));width:min(330px,40vw)}
  #play.choosing #selbar{top:6px;bottom:6px;left:max(6px,env(safe-area-inset-left));width:min(440px,48vw);max-height:none}
  .mbox{max-height:92dvh}
  #menuBtns{grid-template-columns:repeat(3,1fr)}.mbtn{min-height:64px;padding:10px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
}

.tdetail.hintd{display:block;font-size:12.5px;color:#cbd5e1;padding:10px 12px}
/* multiplayer */
.lob{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:linear-gradient(135deg,rgba(96,165,250,.18),rgba(30,46,78,.5));border:1px solid rgba(96,165,250,.4)}
.lobh{display:flex;align-items:center;gap:10px}.lobh span{font-weight:700;font-size:12px;color:#bfdbfe}.code{font-family:ui-monospace,monospace;font-size:24px;letter-spacing:.25em;color:#fff;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:10px}
.lobp{display:flex;flex-direction:column;gap:5px;margin:4px 0}.lpl{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:12px;background:rgba(0,0,0,.2)}.lpl>span:last-child{display:flex;flex-direction:column}.lpl b{font-size:13px}.lpl small{font-size:11px;color:var(--muted)}
.nof{width:36px;height:24px;border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-weight:800}
.lob .btn[disabled]{opacity:.45}
#selbar.inlobby [data-a="spectate"],#selbar.inlobby [data-a="toMenu"]{display:none}
.chatlog{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:rgba(0,0,0,.25)}.cmsg{font-size:13px}.cmsg b{color:var(--gold2)}
.mpchip i{background:rgba(96,165,250,.25)!important}

<body>
<div id="hub">
  <nav class="hnav"><div class="logo"><i>◆</i>GAME HUB</div><span>Free browser games · play &amp; share</span></nav>
  <header class="hero"><h1>Pick a game.<br>Play in your browser.</h1><p>No downloads, no installs. Open a game, play on your phone or computer, and share the link with your friends.</p></header>
  <section id="hubGames"></section>
  <div class="hfoot">Game Hub · More games coming soon</div>
</div>
<div id="game">
  <div id="menu"><div class="mwrap"><h1 class="mtitle">WORLD DOMINATION</h1><div class="msub">GRAND STRATEGY</div><div id="menuBtns"></div><div id="mapsrc"></div></div></div>
  <div id="play">
    <div id="mapwrap"><canvas id="map"></canvas></div>
    <div id="topbar"></div>
    <div id="selbar"></div>
    <div id="panel"><div class="phead"><div class="ptitle"></div><button data-a="closePanel">✕</button></div><div class="pbody"></div></div>
    <div id="mapctl"><button data-a="zin" title="Zoom in">＋</button><button data-a="zout" title="Zoom out">－</button><button data-a="zreset" title="Reset camera">⟲</button><button data-a="home" title="My country">🏠</button><button data-a="modes" title="Map modes">🗺️</button></div>
    <div id="modelabel">Political</div>
    <div id="modes"></div>
    <canvas id="mini" width="400" height="184"></canvas>
    <div id="toasts"></div>
    <div id="bottomnav">
      <button data-a="panel" data-v="advisor" class="advbtn">💡<span>Advisor</span><i class="badge" style="display:none"></i></button>
      <button data-a="panel" data-v="economy">💰<span>Economy</span></button>
      <button data-a="panel" data-v="military">🪖<span>Army</span></button>
      <button data-a="panel" data-v="research">🔬<span>Research</span></button>
      <button data-a="panel" data-v="diplomacy">🤝<span>Diplomacy</span></button>
      <button data-a="panel" data-v="gov:politics">🏛️<span>Politics</span></button>
      <button data-a="panel" data-v="formables">👑<span>Empires</span></button>
      <button data-a="panel" data-v="world:rank">🌍<span>World</span></button>
    </div>
  </div>
  <div id="tooltip"></div>
  <div id="modal"></div>
  <div id="formanim"></div>
</div>

function nkey(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,""); }
let CDATA = {}; const NAME2TAG = {};

// ---------- seeded RNG ----------
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;} return h>>>0; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// ---------- projection (Miller cylindrical, y down) ----------
function projLat(lat){ lat=Math.max(-84,Math.min(84,lat)); const r=lat*Math.PI/180; return -1.25*Math.log(Math.tan(Math.PI/4+0.4*r))*180/Math.PI; }
function unprojY(y){ const v=-y*Math.PI/180/1.25; return (2.5*(Math.atan(Math.exp(v))-Math.PI/4))*180/Math.PI; }

// ---------- source decoders ----------
function decodeEcharts(json){
  if (!json || !json.features) return null;
  if (json.UTF8Encoding) {
    const scale = json.UTF8Scale == null ? 1024 : json.UTF8Scale;
    const dec = (str, off) => { const out=[]; let px=off[0], py=off[1];
      for (let i=0;i<str.length;i+=2){ let x=str.charCodeAt(i)-64, y=str.charCodeAt(i+1)-64; x=(x>>1)^(-(x&1)); y=(y>>1)^(-(y&1)); x+=px; y+=py; px=x; py=y; out.push([x/scale,y/scale]); }
      return out; };
    for (const f of json.features) { const g=f.geometry; if(!g) continue; const co=g.coordinates, eo=g.encodeOffsets;
      for (let c=0;c<co.length;c++){
        if (g.type==="Polygon"){ if(typeof co[c]==="string") co[c]=dec(co[c],eo[c]); }
        else if (g.type==="MultiPolygon"){ for(let k=0;k<co[c].length;k++) if(typeof co[c][k]==="string") co[c][k]=dec(co[c][k],eo[c][k]); }
      } }
    json.UTF8Encoding=false;
  }
  return json;
}
function topoToGeo(topo, objName){
  const obj = topo.objects[objName || Object.keys(topo.objects).find(k=>/countr/i.test(k)) || Object.keys(topo.objects)[0]];
  const tr = topo.transform; const arcs = topo.arcs.map(arc=>{ let x=0,y=0; return arc.map(p=>{ if(tr){ x+=p[0]; y+=p[1]; return [x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]]; } return p.slice(); }); });
  const ring = idx => { const pts=[]; for (const i of idx){ const a = i<0 ? arcs[~i].slice().reverse() : arcs[i]; for (let k=(pts.length?1:0);k<a.length;k++) pts.push(a[k]); } return pts; };
  const feats = (obj.geometries||[]).map(g=>{ let geom=null;
    if (g.type==="Polygon") geom={type:"Polygon",coordinates:g.arcs.map(ring)};
    else if (g.type==="MultiPolygon") geom={type:"MultiPolygon",coordinates:g.arcs.map(p=>p.map(ring))};
    return {type:"Feature",id:g.id,properties:g.properties||{},geometry:geom}; });
  return {type:"FeatureCollection",features:feats};
}
function loadScript(src, timeout=20000){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.async=true; const t=setTimeout(()=>{rej(new Error("timeout"));},timeout); s.onload=()=>{clearTimeout(t);res();}; s.onerror=()=>{clearTimeout(t);rej(new Error("load error"));}; document.head.appendChild(s); }); }
function validGeo(gj){ if(!gj||!gj.features||gj.features.length<100) return false; let ok=0,bad=0; for(const f of gj.features.slice(0,40)){ const g=f.geometry; if(!g) continue; const c=g.type==="Polygon"?g.coordinates[0]:g.type==="MultiPolygon"?g.coordinates[0][0]:null; if(!c||!c[0]) continue; const [x,y]=c[0]; if(Math.abs(x)<=180.5&&Math.abs(y)<=90.5) ok++; else bad++; } return ok>bad*3 && ok>10; }
const MAP_SOURCES = [

  {id:"datamaps", label:"Natural Earth (Datamaps)", load: async ()=>{ await loadScript("https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js"); const D=window.Datamap; if(!D||!D.prototype.worldTopo) return null; return topoToGeo(D.prototype.worldTopo); }},
];
async function loadMapData(progress){
  const errors=[];
  for (const src of MAP_SOURCES){
    try { progress && progress("Loading world map: "+src.label+" …"); const gj = await src.load(); if (validGeo(gj)) return {id:src.id, geo:gj}; errors.push(src.id+": invalid data"); }
    catch(e){ errors.push(src.id+": "+e.message); }
  }
  throw new Error(errors.join("; "));
}

// ---------- geometry helpers ----------
function ringArea(r){ let a=0; for(let i=0,j=r.length-1;i<r.length;j=i++) a+=(r[j][0]+r[i][0])*(r[j][1]-r[i][1]); return a/2; }
function pipRings(rings,x,y){ let inside=false; for(const r of rings){ for(let i=0,j=r.length-1;i<r.length;j=i++){ const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } } return inside; }

// World containers
let REGIONS=[]; // {idx,name,tag,rings(projected),bbox,path,area,provs:[]}
let P=[];       // provinces
let C={};       // countries
let COASTAL=[];
let MAP_ID="";

function buildWorld(geo, mapId){
  MAP_ID = mapId; REGIONS=[]; P=[]; COASTAL=[];
  const tagRegions = {};
  // 1. regions
  for (const f of geo.features){
    const g=f.geometry; if(!g) continue;
    const props=f.properties||{}; const rawName = props.name || props.NAME || props.admin || props.ADMIN || f.id || "Unknown";
    const k=nkey(rawName); if (DROP_NAMES.includes(k)) continue;
    let tag = NAME2TAG[k] || (typeof f.id==="string" && f.id.length===3 && CDATA[f.id.toUpperCase()] ? f.id.toUpperCase() : null) || (props.iso_a3 && CDATA[props.iso_a3] ? props.iso_a3 : null);
    let dep=false;
    if (!tag && DEPENDENCIES[k]) { tag=DEPENDENCIES[k]; dep=true; }
    if (!tag) { tag = "X"+(k.slice(0,2).toUpperCase()||"ZZ")+(hashStr(k)%90+10); if(!CDATA[tag]) CDATA[tag]={tag,name:rawName,capitalName:rawName,pop:0.5,gdp:2,gov:"R",rel:"N",generated:true}; }
    const polys = g.type==="Polygon" ? [g.coordinates] : g.type==="MultiPolygon" ? g.coordinates : [];
    const rings=[]; let area=0; let bb=[1e9,1e9,-1e9,-1e9];
    for (const poly of polys) for (let ri=0; ri<poly.length; ri++){
      const src=poly[ri]; if(!src||src.length<3) continue;
      const r=[]; let latSum=0;
      for (const pt of src){ const x=pt[0], y=projLat(pt[1]); latSum+=pt[1]; r.push([x,y]); if(x<bb[0])bb[0]=x; if(y<bb[1])bb[1]=y; if(x>bb[2])bb[2]=x; if(y>bb[3])bb[3]=y; }
      const geoA = Math.abs(ringArea(src)) * Math.cos((latSum/src.length)*Math.PI/180);
      area += ri===0 ? geoA : -geoA; rings.push(r);
    }
    if (!rings.length || bb[1]>-((-60)*1.0) && false) continue;
    // drop far-south remnants (Antarctic)
    if (unprojY(bb[1]) < -60) continue;
    const path=new Path2D(); for(const r of rings){ path.moveTo(r[0][0],r[0][1]); for(let i=1;i<r.length;i++) path.lineTo(r[i][0],r[i][1]); path.closePath(); }
    const reg={idx:REGIONS.length,name:rawName,tag,dep,rings,bbox:bb,path,area:Math.max(area,0.0005),provs:[]};
    REGIONS.push(reg); (tagRegions[tag]=tagRegions[tag]||[]).push(reg);
  }
  // 2. provinces per tag
  const pathCtx = document.createElement("canvas").getContext("2d");
  for (const tag in tagRegions){
    const regs=tagRegions[tag]; const d=CDATA[tag];
    const totA = regs.reduce((s,r)=>s+r.area,0); const km2 = totA*12364;
    let n = Math.round(1 + Math.sqrt(km2)/260 + Math.log10((d.pop||0.1)+1)*1.4);
    n = Math.max(1, Math.min(26, n));
    const rng = mulberry(hashStr(tag+"#prov"));
    const sorted = regs.slice().sort((a,b)=>b.area-a.area);
    for (const reg of sorted){
      let k = Math.max(1, Math.round(n*reg.area/totA)); if (reg.area < 0.15) k=1; if (reg!==sorted[0] && reg.area/totA<0.03) k=1;
      makeProvinces(reg, k, rng, pathCtx);
    }
  }
  // 3. adjacency
  buildAdjacency();
  return true;
}

function makeProvinces(reg, k, rng){
  const [x0,y0,x1,y1]=reg.bbox; const M=Math.max(40,k*45); const pts=[]; let tries=0;
  while (pts.length<M && tries<M*60){ tries++; const x=x0+(x1-x0)*rng(), y=y0+(y1-y0)*rng(); if (pipRings(reg.rings,x,y)) pts.push([x,y]); }
  if (pts.length<k){ // tiny shapes: use vertices
    const r=reg.rings.reduce((a,b)=>b.length>a.length?b:a); let sx=0,sy=0; for(const p of r){sx+=p[0];sy+=p[1];} pts.push([sx/r.length,sy/r.length]); if(pts.length<k) k=pts.length; }
  // k-means with farthest-point init
  const seeds=[pts[Math.floor(rng()*pts.length)].slice()];
  while (seeds.length<k){ let best=null,bd=-1; for(const p of pts){ let md=1e18; for(const s of seeds){const dx=p[0]-s[0],dy=p[1]-s[1],dd=dx*dx+dy*dy; if(dd<md)md=dd;} if(md>bd){bd=md;best=p;} } seeds.push(best.slice()); }
  const asg=new Int32Array(pts.length);
  for (let it=0; it<8; it++){
    const sx=new Float64Array(k),sy=new Float64Array(k),cn=new Float64Array(k);
    for (let i=0;i<pts.length;i++){ let bi=0,bd=1e18; for(let s=0;s<k;s++){const dx=pts[i][0]-seeds[s][0],dy=pts[i][1]-seeds[s][1],dd=dx*dx+dy*dy; if(dd<bd){bd=dd;bi=s;}} asg[i]=bi; sx[bi]+=pts[i][0]; sy[bi]+=pts[i][1]; cn[bi]++; }
    for (let s=0;s<k;s++) if(cn[s]) { seeds[s][0]=sx[s]/cn[s]; seeds[s][1]=sy[s]/cn[s]; }
  }
  const cnt=new Float64Array(k);
  // snap seeds to nearest member sample (so they're on land)
  for (let s=0;s<k;s++){ let bd=1e18,bp=null; for(let i=0;i<pts.length;i++){ if(asg[i]!==s) continue; cnt[s]++; const dx=pts[i][0]-seeds[s][0],dy=pts[i][1]-seeds[s][1],dd=dx*dx+dy*dy; if(dd<bd){bd=dd;bp=pts[i];} } if(bp) seeds[s]=[bp[0],bp[1]]; }
  const pad=2; const bounds=[x0-pad,y0-pad,x1+pad,y1+pad];
  let vor=null, del=null;
  try { del = d3.Delaunay.from(seeds); vor = del.voronoi(bounds); } catch(e){ vor=null; }
  const base=P.length;
  for (let s=0;s<k;s++){
    let poly = vor ? vor.cellPolygon(s) : null;
    if (!poly) poly=[[bounds[0],bounds[1]],[bounds[2],bounds[1]],[bounds[2],bounds[3]],[bounds[0],bounds[3]]];
    const path=new Path2D(); path.moveTo(poly[0][0],poly[0][1]); for(let i=1;i<poly.length;i++) path.lineTo(poly[i][0],poly[i][1]); path.closePath();
    let bb=[1e9,1e9,-1e9,-1e9]; for(const q of poly){ if(q[0]<bb[0])bb[0]=q[0]; if(q[1]<bb[1])bb[1]=q[1]; if(q[0]>bb[2])bb[2]=q[0]; if(q[1]>bb[3])bb[3]=q[1]; }
    bb=[Math.max(bb[0],x0),Math.max(bb[1],y0),Math.min(bb[2],x1),Math.min(bb[3],y1)];
    const prov={id:P.length, region:reg.idx, core:reg.tag, owner:reg.tag, ctrl:reg.tag, x:seeds[s][0], y:seeds[s][1], cell:poly, path, bbox:bb,
      area: reg.area*(pts.length? cnt[s]/pts.length : 1), adj:[], sea:[], coastal:false, bld:{}, occ:0, resist:0, name:"", terrain:"plains", res:{}, base:0, pop:0, dev:1};
    P.push(prov); reg.provs.push(prov.id);
  }
  // in-region adjacency
  if (k>1){
    if (del && k>3){ for (let s=0;s<k;s++) for (const nb of del.neighbors(s)) link(base+s, base+nb); }
    else for (let a=0;a<k;a++) for (let b=a+1;b<k;b++) link(base+a, base+b);
  }
}
function link(a,b){ if(a===b) return; if(!P[a].adj.includes(b)) P[a].adj.push(b); if(!P[b].adj.includes(a)) P[b].adj.push(a); }
function linkSea(a,b){ if(a===b||P[a].adj.includes(b)) return; if(!P[a].sea.includes(b)) P[a].sea.push(b); if(!P[b].sea.includes(a)) P[b].sea.push(a); }
function nearestProvInRegion(reg,x,y){ let bi=reg.provs[0],bd=1e18; for(const id of reg.provs){ const p=P[id],dx=p.x-x,dy=p.y-y,dd=dx*dx+dy*dy; if(dd<bd){bd=dd;bi=id;} } return bi; }

function buildAdjacency(){
  const CS=0.6, grid=new Map(); const verts=[];
  for (const reg of REGIONS) for (const r of reg.rings){ const step = r.length>600?2:1; for (let i=0;i<r.length;i+=step){ const v={r:reg.idx,x:r[i][0],y:r[i][1],b:false}; verts.push(v); const key=Math.floor(v.x/CS)*100000+Math.floor(v.y/CS); let a=grid.get(key); if(!a){a=[];grid.set(key,a);} a.push(v); } }
  const TH=0.22*0.22; const pairDone=new Set();
  for (const v of verts){
    const gx=Math.floor(v.x/CS), gy=Math.floor(v.y/CS);
    for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++){ const a=grid.get((gx+dx)*100000+(gy+dy)); if(!a) continue;
      for (const w of a){ if (w.r===v.r) continue; const ex=w.x-v.x, ey=w.y-v.y; if (ex*ex+ey*ey<TH){ v.b=true;
        const pa=nearestProvInRegion(REGIONS[v.r],v.x,v.y), pb=nearestProvInRegion(REGIONS[w.r],w.x,w.y); const key=pa<pb?pa+"_"+pb:pb+"_"+pa; if(!pairDone.has(key)){pairDone.add(key); link(pa,pb);} } } }
  }
  // coast
  const coastV=[]; let ci=0;
  for (const v of verts){ if (v.b) continue; ci++; const pid=nearestProvInRegion(REGIONS[v.r],v.x,v.y); P[pid].coastal=true; if (ci%2===0) coastV.push({r:v.r,x:v.x,y:v.y,p:pid}); }
  const CS2=2.5, g2=new Map(); for (const v of coastV){ const key=Math.floor(v.x/CS2)*100000+Math.floor(v.y/CS2); let a=g2.get(key); if(!a){a=[];g2.set(key,a);} a.push(v); }
  const SEA=2.4*2.4; const seaDone=new Set();
  for (const v of coastV){ const gx=Math.floor(v.x/CS2), gy=Math.floor(v.y/CS2);
    for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++){ const a=g2.get((gx+dx)*100000+(gy+dy)); if(!a) continue;
      for (const w of a){ if (w.r===v.r || w.p===v.p) continue; if (REGIONS[w.r].tag===REGIONS[v.r].tag && false) continue; const ex=w.x-v.x, ey=w.y-v.y; if (ex*ex+ey*ey<SEA){ const key=v.p<w.p?v.p+"_"+w.p:w.p+"_"+v.p; if(!seaDone.has(key)){ seaDone.add(key); linkSea(v.p,w.p);} } } } }
  // islands with no connection at all: link to nearest province of any other region by sea
  for (const p of P){ if (p.adj.length||p.sea.length) continue; let bi=-1,bd=1e18; for(const q of P){ if(q.region===p.region) continue; const dx=q.x-p.x,dy=q.y-p.y,dd=dx*dx+dy*dy; if(dd<bd){bd=dd;bi=q.id;} } if(bi>=0){ p.coastal=true; P[bi].coastal=true; linkSea(p.id,bi);} }
  COASTAL = P.filter(p=>p.coastal).map(p=>p.id);
}

function hsl2hex(h,s,l){ s/=100;l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); const t=x=>Math.round(x*255).toString(16).padStart(2,"0"); return "#"+t(f(0))+t(f(8))+t(f(4)); }

function tier(d){ const pc = d.gdp/Math.max(0.1,d.pop)*1000; let t=0; if(d.gdp>40||pc>15000) t=1; if(d.gdp>300||pc>30000) t=2; if(d.gdp>2000) t=3; return t; }

function initCountries(){
  C={};
  const byTag={}; for (const p of P){ (byTag[p.owner]=byTag[p.owner]||[]).push(p); }
  for (const tag in byTag){
    const d=CDATA[tag]; const provs=byTag[tag];
    const c={tag, name:d.name, baseName:d.name, color:FIXED_COLORS[tag]||colorFor(tag), flag:FLAGS[tag]||null, gov:d.gov, rel:d.rel, capital:provs[0].id,
      treasury: d.gdp*0.06+0.5, debt: d.gdp*0.15, inflation: 2+((hashStr(tag)%30)/10), tax:0.2, stability: 60+(GOVS[d.gov].stab||0), approval:55, warExh:0,
      manpower:0, rp:0, di:20, techs:{}, research:[null,null], laws:{conscription:1,economy:1,trade:1}, mods:newMods(), stock:{}, gdp:d.gdp, pop:d.pop, alive:true, overlord:null,
      ai:{aggr: ((hashStr(tag+"ag")%100)/100)*0.6 + (["X","J","F","K"].includes(d.gov)?0.35:0) + (["T"].includes(d.gov)?0.2:0), lastWar:-9999, focus:["eco","mil","sci"][hashStr(tag)%3]},
      generals:[], decisions:{}, formed:[], history:[], cb:{}, buildQ:[], recruitQ:[], nextElection: 365*(1+hashStr(tag)%4), income:{}, generated:!!d.generated, lastGovChange:-999, lastDip:{}, tradeAg:{}, nap:{}, defPact:{}, guarantee:{}, access:{}, sanction:{}, partyFx:[], justify:null, missileCd:0, strikes:0 };
    for (const k of RES_KEYS) c.stock[k]=2;
    C[tag]=c;
    // capital
    const cc = CAP_COORDS[tag]; let cap = provs[0];
    if (cc){ const x=cc[0], y=projLat(cc[1]); let bd=1e18; for(const p of provs){ const dx=p.x-x, dy=p.y-y, dd=dx*dx+dy*dy; if(dd<bd){bd=dd;cap=p;} } }
    else { const big = REGIONS[provs[0].region]; let sx=0,sy=0,n=0; for(const id of big.provs){sx+=P[id].x;sy+=P[id].y;n++;} sx/=n; sy/=n; let bd=1e18; for(const id of big.provs){ const p=P[id],dx=p.x-sx,dy=p.y-sy,dd=dx*dx+dy*dy; if(dd<bd){bd=dd;cap=p;} } }
    c.capital=cap.id;
    // province economics
    let wsum=0; const w={}; for (const p of provs){ w[p.id]=Math.pow(p.area+0.01,0.45)*(p.id===cap.id?2.2:1)*(REGIONS[p.region].dep?0.5:1); wsum+=w[p.id]; }
    for (const p of provs){ p.base=d.gdp*w[p.id]/wsum; p.pop=d.pop*w[p.id]/wsum; }
    nameProvinces(tag, provs, cap);
    // terrain
    for (const p of provs){ const r=mulberry(hashStr("t"+p.id+tag))(); const lat=unprojY(p.y); let t="plains";
      if (Math.abs(lat)>58) t="tundra"; else if (DESERT_C.has(tag)&&r<0.7) t="desert"; else if (MOUNTAIN_C.has(tag)&&r<0.55) t="mountain"; else if (Math.abs(lat)<12&&r<0.6) t="jungle"; else if (r<0.35) t="forest"; else if (r<0.45) t="hills";
      p.terrain=t; }
    // resources
    const rr=mulberry(hashStr(tag+"res")); const prof=RES_PROFILE[tag]||{};
    for (const p of provs) p.res={food:0.1+(p.terrain==="plains"?0.15:0)};
    for (const k in prof){ const amt=prof[k]; const nPick=Math.max(1,Math.min(provs.length,Math.ceil(provs.length*0.4))); for(let i=0;i<nPick;i++){ const p=provs[Math.floor(rr()*provs.length)]; p.res[k]=(p.res[k]||0)+amt/nPick; } }
    if (!RES_PROFILE[tag]){ const keys=["iron","coal","gold","aluminum","oil","gas","food"]; if (rr()<0.5){ const p=provs[Math.floor(rr()*provs.length)]; const k=keys[Math.floor(rr()*keys.length)]; p.res[k]=(p.res[k]||0)+0.3+rr()*0.6; } }
  }
}
function nameProvinces(tag, provs, cap){
  const nm=CDATA[tag].name; let sx=0,sy=0; for(const p of provs){sx+=p.x;sy+=p.y;} sx/=provs.length; sy/=provs.length;
  let sdx=0,sdy=0; for(const p of provs){ sdx=Math.max(sdx,Math.abs(p.x-sx)); sdy=Math.max(sdy,Math.abs(p.y-sy)); }
  const used={};
  for (const p of provs){
    let name;
    if (p.id===cap.id) name=CDATA[tag].capitalName;
    else if (REGIONS[p.region].dep && REGIONS[p.region].provs.length===1) name=REGIONS[p.region].name.replace(" Is."," Islands");
    else if (provs.length<=1) name=nm;
    else { const dx=(p.x-sx)/(sdx||1), dy=(p.y-sy)/(sdy||1); const ns = dy<-0.33?"North":dy>0.33?"South":""; const ew = dx>0.33?"East":dx<-0.33?"West":"";
      const adj = ns&&ew ? ns+ew.toLowerCase()+"ern" : ns ? ns+"ern" : ew ? ew+"ern" : "Central";
      name = adj+" "+nm; }
    if (used[name]) { used[name]++; name += " " + ["","I","II","III","IV","V","VI","VII","VIII","IX","X"][Math.min(10,used[name])]; } else used[name]=1;
    p.name=name;
  }
}

function initGame(playerTag, opts={}){
  G = {day:0, speed:1, paused:true, player:playerTag, spectator:!playerTag, wars:[], alliances:[], rel:{}, armies:[], nextId:1, log:[], news:[], market:{price:{},supply:{},demand:{},hist:{}}, battles:{},
       settings:Object.assign({sound:true,music:false,flagMode:"all",aiAggr:"normal",autosave:true,provBorders:true,labels:true}, loadSettings()), mapMode:"political", sel:null, eventsSeen:{}, worldTension:0, started:Date.now(), mapId:MAP_ID, pendingEvents:[] };
  for (const p of P){ p.owner=p.core=REGIONS[p.region].tag; p.ctrl=p.owner; p.bld={}; p.occ=0; p.resist=0; }
  initCountries();
  for (const k of RES_KEYS){ G.market.price[k]=RES_BASE_PRICE[k]; G.market.hist[k]=[]; }
  // relations
  for (const [a,b,v] of RIVALS) setRel(a,b,v);
  for (const [a,b,v] of FRIENDS) setRel(a,b,v);
  for (const t in C){ const c=C[t]; for (const n of neighborsOf(t)){ if (getRel(t,n)===0){ const s=(CDATA[t].rel===CDATA[n].rel?15:-5)+(hashStr(t+n)%20)-10; setRel(t,n,s);} } }
  for (const a of EU) for (const b of EU) if (a<b && C[a] && C[b]) setRel(a,b,Math.max(getRel(a,b),45));
  if (false) for (const al of START_ALLIANCES){ const m=al.members.filter(t=>C[t]); if (m.length>1){ G.alliances.push({id:G.nextId++,name:al.name,color:al.color,members:m,leader:m[0]}); for(const a of m) for(const b of m) if(a<b) setRel(a,b,Math.max(getRel(a,b),50)); } }
  // technologies, buildings, armies, generals
  for (const t in C){
    const c=C[t], d=CDATA[t], tr=tier(d), provs=ownedProvs(t);
    const T0=["inf1","art1","nav1"], T1=["air1","armor1","con1","eco1","sci1","ext1"], T2=["armor2","aa1","ind1","eco2","eco3","pol1","log1","med1"], T3=["nav2","nav3","air2","sf1","mis1","sci2","art2","pol3","ind2"];
    const give = l=>{ for(const id of l){ c.techs[id]=true; applyTech(c,id,true);} };
    if (tr>=0 && d.gdp>15) give(T0); if (tr>=1) give(T1); if (tr>=2) give(T2); if (tr>=3) give(T3);
    if (NUKE_POWERS.includes(t)) give(["art1","art2","mis1","sci1","nucE","nuc1"]);
    const cap=P[c.capital];
    const pc = d.gdp/Math.max(0.1,d.pop);
    for (const p of provs){
      const infra = Math.max(0, Math.min(4, Math.round(Math.log10(pc*1000+1)-2.6)));
      if (infra) p.bld.infra=infra;
      const fac = Math.min(5, Math.floor(p.base/60)); if (fac) p.bld.factory=fac;
      const com = Math.min(4, Math.floor(p.base/90)); if (com) p.bld.commercial=com;
      if (p.res.oil||p.res.gas||p.res.iron||p.res.coal||p.res.gold) { if (d.gdp>30) p.bld.mine=1; }
      if (p.base>40) p.bld.farm=1;
    }
    cap.bld.university=Math.min(3,1+(tr>=2?1:0)+(tr>=3?1:0)); if (tr>=2) cap.bld.lab=tr>=3?2:1;
    if (tr>=1){ cap.bld.milfac=Math.min(5,1+Math.floor(Math.sqrt(d.gdp)/25)); cap.bld.airbase=1; }
    const coastal=provs.filter(p=>p.coastal); if (coastal.length && d.gdp>8){ const port=coastal.reduce((a,b)=>b.base>a.base?b:a); port.bld.port=Math.min(3,1+tr); if(tr>=1) port.bld.dockyard=Math.min(3,tr); }
    if (NUKE_POWERS.includes(t)) cap.bld.missile=1;
    if (tr>=2) cap.bld.fort=1;
    // generals
    const gr=mulberry(hashStr(t+"gen")); const ng=2+tr;
    for (let i=0;i<ng;i++){ const trt=TRAITS[Math.floor(gr()*TRAITS.length)]; c.generals.push({id:G.nextId++,name:"Gen. "+SURNAMES[Math.floor(gr()*SURNAMES.length)],skill:1+Math.floor(gr()*4)+(gr()<0.15?1:0),trait:trt[0],tk:trt[1],tv:trt[2],army:null}); }
    // armies
    const sq=Math.sqrt(d.gdp), inf=Math.round(2+sq*0.45+Math.sqrt(d.pop)*0.35);
    const u={inf}; u.art=Math.round(inf/5); if (c.techs.armor1) u.mech=Math.round(inf/5); if (c.techs.armor2) u.tank=Math.round(inf/4); if(c.techs.aa1) u.aa=Math.round(inf/8);
    if (c.techs.sf1) u.sf=Math.round(inf/12);
    if (c.techs.air1) u.fighter=Math.round(sq*0.12); if (c.techs.air2) u.bomber=Math.round(sq*0.05);
    if (coastal.length && c.techs.nav1){ u.destroyer=Math.round(sq*0.06); u.transport=Math.max(1,Math.round(sq*0.03)); if(c.techs.nav2) u.sub=Math.round(sq*0.03); if (CARRIERS[t]) u.carrier=CARRIERS[t]; }
    for (const k in u) if (!u[k]) delete u[k];
    // split land/navy for big countries
    const nArmies = Math.min(4, 1+Math.floor(provs.length/6));
    const landKeys=["inf","art","mech","tank","aa","sf"]; const sorted = provs.slice().sort((a,b)=>b.base-a.base);
    for (let i=0;i<nArmies;i++){
      const units={}; for (const k of landKeys) if (u[k]) { const share = Math.floor(u[k]/nArmies) + (i===0? u[k]%nArmies : 0); if (share>0) units[k]=share; }
      if (i===0){ for (const k of ["fighter","bomber","destroyer","transport","sub","carrier"]) if (u[k]) units[k]=u[k]; }
      const loc = i===0 ? cap : sorted[Math.min(sorted.length-1,i)];
      if (Object.keys(units).length) createArmy(t, loc.id, units, i===0 && c.generals[0] ? c.generals[0] : null);
    }
    { let tot=0; for (const p of provs) tot+=provGDP(p); const f=d.gdp/Math.max(0.001,tot); for (const p of provs) p.base*=f; }
    c.manpower = c.pop*1e6*0.02*LAWS.conscription.opts[1][1];
    c.gdp = d.gdp;
  }
  computeAllEconomy(true);
  for (const t in C) recordHistory(C[t]);
  if (playerTag) { C[playerTag].isPlayer=true; C[playerTag].treasury += C[playerTag].gdp*0.02+2; }
  G.paused=true;
  return G;
}

function relKey(a,b){ return a<b?a+"|"+b:b+"|"+a; }
function getRel(a,b){ return G.rel[relKey(a,b)]||0; }
function setRel(a,b,v){ if(a===b) return; G.rel[relKey(a,b)]=Math.max(-100,Math.min(100,v)); }
function addRel(a,b,v){ setRel(a,b,getRel(a,b)+v); }
function ownedProvs(tag){ const r=[]; for(const p of P) if(p.owner===tag) r.push(p); return r; }
function ctrlProvs(tag){ const r=[]; for(const p of P) if(p.ctrl===tag) r.push(p); return r; }
function neighborsOf(tag){ const s=new Set(); for(const p of P){ if(p.owner!==tag) continue; for(const q of p.adj){ const o=P[q].owner; if(o!==tag) s.add(o);} } return [...s]; }
function seaNeighborsOf(tag){ const s=new Set(); for(const p of P){ if(p.owner!==tag) continue; for(const q of p.sea){ const o=P[q].owner; if(o!==tag) s.add(o);} } return [...s]; }
function applyTech(c,id,on){ const e=TECHS[id][5]; for (const k in e) c.mods[k]=(c.mods[k]||0)+(on?e[k]:-e[k]); }

function createArmy(owner, prov, units, general){
  const a={id:G.nextId++, owner, prov, units:Object.assign({},units), org:100, path:[], prog:0, general: general?general.id:null, mode:"offense", name:"", battle:false, retreating:false};
  if (general) general.army=a.id;
  const c=C[owner]; const n = G.armies.filter(x=>x.owner===owner).length+1;
  a.name = (c? (c.baseName.length>14? c.tag : c.baseName) : owner)+" "+ordinal(n)+" Army";
  G.armies.push(a); return a;
}
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function armySize(a){ let s=0; for(const k in a.units) s+=a.units[k]; return s; }
function landSize(a){ let s=0; for(const k in a.units) if(UNITS[k].kind==="land") s+=a.units[k]; return s; }
function navalCap(a){ return (a.units.transport||0); }

function loadSettings(){ try{ const s=JSON.parse(localStorage.getItem("wd_settings")||"{}"); if (!s.flagV2){ s.flagMode="all"; s.flagV2=true; } return s; }catch(e){ return {flagMode:"all",flagV2:true}; } }
function saveSettings(){ try{ localStorage.setItem("wd_settings", JSON.stringify(G.settings)); }catch(e){} }

const TERRAIN = { plains:{w:100,def:1.0,spd:1.0,attr:0}, hills:{w:80,def:1.2,spd:0.85,attr:0}, forest:{w:80,def:1.15,spd:0.8,attr:0}, desert:{w:90,def:1.0,spd:0.85,attr:0.002}, jungle:{w:60,def:1.25,spd:0.6,attr:0.001}, mountain:{w:55,def:1.5,spd:0.6,attr:0.001}, tundra:{w:80,def:1.1,spd:0.7,attr:0.002} };
const TERRAIN_NAMES = {plains:"Plains",hills:"Hills",forest:"Forest",desert:"Desert",jungle:"Jungle",mountain:"Mountains",tundra:"Tundra"};

function lawOpt(c,law){ return LAWS[law].opts[c.laws[law]]; }
function lawMod(c,key){ let s=0; for (const l in LAWS){ const o=lawOpt(c,l)[2]; if (o[key]) s+=o[key]; } return s; }
function M(c,key){ return (c.mods[key]||0) + lawMod(c,key); }
function govOf(c){ return GOVS[c.gov]||GOVS.R; }

function allianceOf(tag){ return G.alliances.find(a=>a.members.includes(tag)); }
function sameAlliance(a,b){ const al=allianceOf(a); return !!(al && al.members.includes(b)); }
function isAlly(a,b){ if(a===b) return true; const ca=C[a], cb=C[b]; if(!ca||!cb) return false; if (ca.overlord===b||cb.overlord===a||(ca.overlord&&ca.overlord===cb.overlord)) return true; return sameAlliance(a,b); }
function warsOf(tag){ return G.wars.filter(w=>w.att.includes(tag)||w.def.includes(tag)); }
function atWar(a,b){ if(a===b) return false; for (const w of G.wars){ if ((w.att.includes(a)&&w.def.includes(b))||(w.def.includes(a)&&w.att.includes(b))) return true; } return false; }
function atWarAny(tag){ return G.wars.some(w=>w.att.includes(tag)||w.def.includes(tag)); }
function hasAccess(a,b){ return isAlly(a,b) || (C[b]&&C[b].access[a]); }
function canEnter(tag,pid){ const ct=P[pid].ctrl; return ct===tag || hasAccess(tag,ct) || atWar(tag,ct); }
function hostileProv(tag,pid){ return atWar(tag,P[pid].ctrl); }

function provGDP(p){
  const c=C[p.owner]; if(!c) return 0; const b=p.bld;
  let m = 1 + 0.08*(b.factory||0)*(1+M(c,"factory")) + 0.10*(b.commercial||0)*(1+M(c,"commercial")) + 0.05*(b.infra||0) + 0.02*(b.farm||0) + 0.04*(b.airport||0) + 0.03*(b.port||0);
  m *= 1+M(c,"gdp");
  return p.base*m;
}
function provValue(p){ return provGDP(p)+p.pop*0.5+1; }
function milStrength(tag){ let s=0; for (const a of G.armies){ if(a.owner!==tag) continue; s+=armyPowerAt(a,P[a.prov],false)/(0.5+0.5*a.org/100); } return s; }
function navalPower(tag){ let s=0; for (const a of G.armies) if(a.owner===tag) for(const k in a.units) if(UNITS[k].kind==="naval") s+=a.units[k]*(UNITS[k].atk+UNITS[k].def+UNITS[k].hp*0.3); return s; }
function airPower(tag){ let s=0; for (const a of G.armies) if(a.owner===tag) for(const k in a.units) if(UNITS[k].kind==="air") s+=a.units[k]*(UNITS[k].atk+UNITS[k].def); return s; }
function countBld(tag,k){ let s=0; for(const p of P) if(p.owner===tag) s+=p.bld[k]||0; return s; }
function rpPerDay(c){ let uni=0,lab=0; for(const p of P){ if(p.owner!==c.tag||p.ctrl!==c.tag) continue; uni+=p.bld.university||0; lab+=p.bld.lab||0; } const stabF=0.6+0.4*Math.min(1,c.stability/60); return (1+Math.sqrt(Math.max(0,c.gdp))*0.05+uni*1.5+lab*3+(c.mods.rpFlat||0))*(1+M(c,"rp"))*stabF; }
function diPerMonth(c){ return (2+Math.sqrt(Math.max(0,c.gdp))*0.1)*(1+M(c,"di")); }
function mpCap(c){ return c.pop*1e6*0.02*lawOpt(c,"conscription")[1]*(1+M(c,"mp")); }
function infMult(c){ return 1+Math.max(0,c.inflation-2)/100; }

// ---------- ECONOMY (monthly) ----------
function computeEconomy(c, init){
  let gdp=0,pop=0,bldUpk=0,ports=0;
  for (const p of P){ if (p.owner!==c.tag) continue; const g=provGDP(p); gdp += g*(p.ctrl===p.owner?1:0.3)*(1-Math.min(0.5,p.resist*0.005)); pop+=p.pop;
    for (const k in p.bld) bldUpk+=(BUILDINGS[k]?BUILDINGS[k].upk:0)*p.bld[k]; ports+=p.bld.port||0; }
  const sanc = Object.keys(c.sanction).length? 0 : 0; let sanctioned=0; for (const t in C) if (C[t].alive && C[t].sanction[c.tag]) sanctioned++;
  gdp *= Math.max(0.6, 1 - sanctioned*0.02);
  c.gdp=gdp; c.pop=pop;
  const stabEff = 0.7+0.3*Math.min(1,c.stability/50);
  const tax = gdp*c.tax/12*govOf(c).tax*(1+M(c,"taxEff"))*stabEff;
  const social = gdp*0.08/12;
  let milUpk=0; for (const a of G.armies) if (a.owner===c.tag) for (const k in a.units) milUpk+=a.units[k]*UNITS[k].upk; milUpk*=(1+M(c,"upk"));
  const nTrade = Math.min(8,Object.keys(c.tradeAg).length);
  const trade = gdp*0.0012*nTrade*(1+M(c,"trade")) + ports*Math.sqrt(Math.max(0,gdp))*0.004;
  const interest = c.debt*0.004*Math.max(0.2,1+M(c,"interest"));
  bldUpk *= infMult(c);
  c.income={tax,trade,social:-social,military:-milUpk,buildings:-bldUpk,interest:-interest,market:c.income&&c.income.market||0};
  c.net = tax+trade-social-milUpk-bldUpk-interest;
  if (init) return;
  c.treasury += c.net;
  if (c.treasury<0){ c.debt += -c.treasury*1.02; c.treasury=0; }
  if (c.debt>gdp*1.6 && !c.bankrupt){ c.bankrupt=true; c.stability-=15; if(c.isPlayer) notify("💸 National bankruptcy! Creditors refuse new loans. Stability -15.","bad"); }
  if (c.debt<gdp*1.2) c.bankrupt=false;
  // inflation
  const dRatio=c.debt/Math.max(1,gdp);
  c.inflation += (dRatio>0.9?0.15:0) + (c.treasury>gdp*0.5?0.1:0) + (c.bankrupt?0.4:0);
  c.inflation += (2 - c.inflation)*0.05*(1+Math.max(0,-M(c,"infl")));
  c.inflation = Math.max(0, Math.min(80,c.inflation));
  // growth
  let g = 0.0012 + M(c,"growth") + (govOf(c).growth-1)*0.01 - (atWarAny(c.tag)?0.0008:0) - (c.stability<30?0.001:0) - Math.max(0,c.inflation-10)*0.0001 - (c.tax-0.2)*0.004 - (c.shortage&&c.shortage.oil?0.001:0);
  if (c.recession>0){ g-=0.004; c.recession--; }
  for (const p of P){ if (p.owner!==c.tag||p.ctrl!==p.owner) continue; p.base*=1+g+(p.bld.infra||0)*0.0001; p.pop*=1+0.0008+M(c,"pop")-(c.shortage&&c.shortage.food?0.001:0); }
  // manpower
  const cap=mpCap(c); c.manpower=Math.min(cap, c.manpower + cap*0.05);
  c.di = Math.min(500, c.di+diPerMonth(c));
  // stability & approval
  const exh = c.warExh;
  const target = 58 + govOf(c).stab + M(c,"stab") - (c.tax-0.2)*120 - exh*0.4 - Math.max(0,c.inflation-8)*0.6 - (c.shortage&&c.shortage.food?8:0) + (c.approval-50)*0.2 - sanctioned*1.5;
  c.stability += (target-c.stability)*0.08; c.stability=Math.max(0,Math.min(100,c.stability));
  const at = 55 + M(c,"appr") + g*2000 - (c.tax-0.2)*80 - exh*0.3;
  c.approval += (at-c.approval)*0.1; c.approval=Math.max(0,Math.min(100,c.approval));
  if (!atWarAny(c.tag)) c.warExh=Math.max(0,c.warExh-2);
  if (c.missileCd>0) c.missileCd=Math.max(0,c.missileCd-30);
}
function computeAllEconomy(init){ for (const t in C) if (C[t].alive) computeEconomy(C[t],init); }

function resProduction(c){ const out={}; for(const k of RES_KEYS) out[k]=0; for (const p of P){ if (p.owner!==c.tag||p.ctrl!==c.tag) continue; const mul=(1+0.5*(p.bld.mine||0))*(1+M(c,"res")); for (const k in p.res) out[k]+=p.res[k]*(k==="food"?1:mul); out.food+=(p.bld.farm||0)*0.4; } return out; }
function resDemand(c){ const d={}; for(const k of RES_KEYS) d[k]=0; const fac=countBld(c.tag,"factory"), mf=countBld(c.tag,"milfac"), labs=countBld(c.tag,"lab");
  d.food=c.pop*0.004; d.oil=c.gdp*0.00035*Math.max(0.3,1+M(c,"oilUse")); d.gas=c.gdp*0.0002; d.steel=fac*0.05+mf*0.1; d.coal=fac*0.05; d.iron=(fac*0.05+mf*0.1)*0.4; d.aluminum=c.gdp*0.00005; d.rare=labs*0.05+c.gdp*0.00003; d.uranium=(c.decisions.nuclear?0.3:0)+countBld(c.tag,"missile")*0.05;
  for (const a of G.armies) if (a.owner===c.tag) for (const k in a.units){ d.oil+=a.units[k]*UNITS[k].oil/60; if(UNITS[k].kind==="air") d.aluminum+=a.units[k]*0.02; }
  return d; }
function monthlyMarket(){
  const S={},D={}; for (const k of RES_KEYS){S[k]=0;D[k]=0;}
  for (const t in C){ const c=C[t]; if(!c.alive) continue; const pr=resProduction(c), de=resDemand(c); c.prod=pr; c.dem=de; c.exports=0; c.imports=0; c.shortage={}; let mk=0;
    for (const k of RES_KEYS){ S[k]+=pr[k]; D[k]+=de[k]; c.stock[k]=(c.stock[k]||0)+pr[k]-de[k];
      const auto = !c.isPlayer || G.settings.autoTrade!==false; const price=G.market.price[k];
      const reserve = de[k]*3;
      if (auto && c.stock[k]>reserve+0.05 && k!=="gold"){ const sell=(c.stock[k]-reserve); const val=sell*price*0.95*(lawOpt(c,"trade")[0]==="Closed Economy"?0.5:1); c.stock[k]-=sell; c.treasury+=val; mk+=val; c.exports+=val; }
      if (c.stock[k]<0){ const need=-c.stock[k]; const cost=need*price*1.05; if (auto && c.treasury>=cost && !c.bankrupt){ c.treasury-=cost; c.stock[k]=0; mk-=cost; c.imports+=cost; } else { if(k==="food"||k==="oil") c.shortage[k]=true; c.stock[k]=Math.max(c.stock[k],-de[k]*2); } }
    }
    c.income.market=mk;
  }
  for (const k of RES_KEYS){ const ratio=(D[k]+0.01)/(S[k]+0.01); const target=RES_BASE_PRICE[k]*Math.max(0.35,Math.min(3.5,Math.pow(ratio,0.6))); const noise=1+(Math.random()-0.5)*0.06; G.market.price[k]=Math.max(0.05,(G.market.price[k]*0.8+target*0.2)*noise); G.market.supply[k]=S[k]; G.market.demand[k]=D[k]; G.market.hist[k].push(+G.market.price[k].toFixed(3)); if(G.market.hist[k].length>240) G.market.hist[k].shift(); }
}

// ---------- PATHFINDING ----------
let NAVAL_LINKS=null;
function buildNavalLinks(){ NAVAL_LINKS={}; const R=30*30; for (const a of COASTAL){ NAVAL_LINKS[a]=[]; } for (let i=0;i<COASTAL.length;i++) for (let j=i+1;j<COASTAL.length;j++){ const a=P[COASTAL[i]], b=P[COASTAL[j]]; let dx=a.x-b.x; if (dx>180) dx-=360; if(dx<-180) dx+=360; const dy=a.y-b.y; if (dx*dx+dy*dy<R){ NAVAL_LINKS[a.id].push(b.id); NAVAL_LINKS[b.id].push(a.id);} } }
function lonlat(p){ return [p.x, unprojY(p.y)]; }
function distKm(a,b){ const [lo1,la1]=lonlat(a), [lo2,la2]=lonlat(b); const r=Math.PI/180; const dla=(la2-la1)*r, dlo=(lo2-lo1)*r; const h=Math.sin(dla/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dlo/2)**2; return 12742*Math.asin(Math.min(1,Math.sqrt(h))); }
function armyCaps(a){ const land=landSize(a); let naval=0; for(const k in a.units) if(UNITS[k].kind==="naval") naval+=a.units[k]; const seaOK = land===0 ? naval>0||true : (a.units.transport||0)*15 >= land-0.01; return {land, naval, seaOK, navalOnly: land===0 && naval>0}; }
function findPath(a, target){
  if (a.prov===target) return [];
  const caps=armyCaps(a); if (!NAVAL_LINKS) buildNavalLinks();
  const n=P.length; const dist=new Float64Array(n).fill(Infinity), prev=new Int32Array(n).fill(-1); dist[a.prov]=0;
  const heap=[[0,a.prov]]; const push=(d,v)=>{ heap.push([d,v]); let i=heap.length-1; while(i>0){ const pi=(i-1)>>1; if(heap[pi][0]<=heap[i][0]) break; [heap[pi],heap[i]]=[heap[i],heap[pi]]; i=pi; } };
  const pop=()=>{ const top=heap[0]; const last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=2*i+1,r=l+1; let m=i; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===i) break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } return top; };
  while (heap.length){
    const [d,u]=pop(); if (d>dist[u]) continue; if (u===target) break;
    const pu=P[u];
    const relax=(v,w)=>{ if (v!==target && hostileProv(a.owner,v) && v!==u) w*=3; if (!canEnter(a.owner,v)) return; const nd=d+w; if (nd<dist[v]){ dist[v]=nd; prev[v]=u; push(nd,v);} };
    if (!caps.navalOnly) for (const v of pu.adj) relax(v, distKm(pu,P[v])/TERRAIN[P[v].terrain].spd);
    if (caps.seaOK){ for (const v of pu.sea) relax(v, distKm(pu,P[v])*0.5+150);
      if (pu.coastal && NAVAL_LINKS[u]) for (const v of NAVAL_LINKS[u]) relax(v, distKm(pu,P[v])*0.5+300); }
  }
  if (!isFinite(dist[target])) return null;
  const path=[]; let v=target; while (v!==a.prov){ path.push(v); v=prev[v]; if (v<0) return null; } path.reverse(); return path;
}
function isSeaEdge(u,v){ return !P[u].adj.includes(v); }
function armySpeed(a, dest){
  const c=C[a.owner]; let sp=Infinity; const land=landSize(a);
  for (const k in a.units){ const u=UNITS[k]; if (land>0 && u.kind!=="land") continue; sp=Math.min(sp,u.spd); }
  if (!isFinite(sp)) sp=40;
  const gen=generalOf(a); const gb = gen ? (gen.tk==="speed"?gen.tv:0) : 0;
  return sp*(1+M(c,"speed")+gb+0.1*drillLv(a,P[dest].terrain))*(1+0.08*(P[dest].bld.infra||0));
}
const TRAIN_MAX=3, TRAIN_DAYS=30;
function trainCost(a,t){ const lv=(a.drill&&a.drill[t])||0; return Math.max(0.2, landSize(a)*0.03*(lv+1))*infMult(C[a.owner]); }
function canTrain(a,t){ const lv=(a.drill&&a.drill[t])||0; if (lv>=TRAIN_MAX) return "Maximum training level reached"; if (a.training) return "Already training"; if (a.battle) return "In battle"; if (a.path.length) return "Army is moving"; if (landSize(a)<0.5) return "Needs land units"; const p=P[a.prov]; if (p.ctrl!==a.owner && !isAlly(a.owner,p.ctrl)) return "Must be in your own territory"; if (C[a.owner].treasury<trainCost(a,t)) return "Not enough money"; return null; }
function startTraining(a,t){ const err=canTrain(a,t); if (err) return [false,err]; const cost=trainCost(a,t); C[a.owner].treasury-=cost; a.training={t,until:G.day+TRAIN_DAYS,start:G.day}; a.path=[]; a.auto=null; return [true,a.name+" began "+TERRAIN_NAMES[t]+" training (30 days, $"+fmtB(cost)+")."]; }
function trainingTick(){ for (const a of G.armies){ if (!a.training) continue; if (a.battle){ continue; } if (G.day>=a.training.until){ const t=a.training.t; a.drill=a.drill||{}; a.drill[t]=Math.min(TRAIN_MAX,(a.drill[t]||0)+1); a.training=null; if (a.owner===G.player){ notify("🎓 "+a.name+" completed "+TERRAIN_NAMES[t]+" training (level "+a.drill[t]+").","good",a.prov); sfx("tech"); } } } }
function drillLv(a,t){ return (a.drill&&a.drill[t])||0; }
function generalOf(a){ if(!a.general) return null; const c=C[a.owner]; return c? c.generals.find(g=>g.id===a.general):null; }
function orderMove(a, target){ if (a.training) return false; const path=findPath(a,target); if (!path) return false; a.path=path; a.prog=0; a.retreating=false; return true; }

// ---------- DAILY TICK ----------
function dailyTick(){
  G.day++;
  moveArmies();
  resolveBattles();
  occupation();
  if (G.day%5===0) supplyAttrition();
  progressQueues();
  updateWars();
  aiDaily();
  autoArmies();
  trainingTick();
  if (dayOfMonth(G.day)===1) monthlyTick();
}
function monthlyTick(){
  computeAllEconomy(false);
  monthlyMarket();
  for (const t in C){ const c=C[t]; if (!c.alive) continue; politicsMonthly(c); }
  aiMonthly();
  eventsMonthly();
  checkFormables();
  diplomacyMonthly();
  for (const t in C) if (C[t].alive) recordHistory(C[t]);
  if (G.settings.autosave && !G.spectator && G.day%90<31) saveGame("auto");
}
function recordHistory(c){ c.history.push([G.day, +c.gdp.toFixed(1), +milStrength(c.tag).toFixed(0), ownedProvs(c.tag).length, +c.pop.toFixed(2)]); if (c.history.length>720) c.history.splice(0, c.history.length-720); }

function moveArmies(){
  for (const a of G.armies) a.moving=false;
  for (const a of G.armies){
    if (!a.path.length || a.battle || a.training) continue;
    if (!a.retreating && landSize(a)>0 && hostileProv(a.owner,a.prov)) continue; // must take province before moving on
    const next=a.path[0];
    if (!canEnter(a.owner,next)){ a.path=[]; continue; }
    const sea=isSeaEdge(a.prov,next);
    const len = sea ? distKm(P[a.prov],P[next])+100 : distKm(P[a.prov],P[next])/TERRAIN[P[next].terrain].spd;
    const sp = sea ? 350 : armySpeed(a,next);
    a.eLen=len; a.eSpd=sp; a.moving=true; a.from=a.prov;
    a.prog += sp;
    if (a.prog>=len){ a.prov=next; a.path.shift(); a.prog=a.path.length? Math.min(a.prog-len, sp*0.99) : 0; a.from=next; if (!a.path.length){ a.retreating=false; a.moving=false; } }
  }
}

// ---------- COMBAT (deterministic: the stronger side wins) ----------
// Power of one army in a province. Everything that matters is in here and shown to the player.
function powerMods(a,p,k){ const c=C[a.owner]; const u=UNITS[k]; const gen=generalOf(a); const gsk=gen?gen.skill*0.04:0;
  let am=1+M(c,"allAtk")+gsk, dm=1+M(c,"allDef")+gsk;
  if (k==="inf"||k==="sf"){ am+=M(c,"infAtk"); dm+=M(c,"infDef"); }
  if (k==="tank"||k==="mech"){ dm+=M(c,"armDef"); if(gen&&gen.tk==="tank") am+=gen.tv; }
  if (k==="art") am+=M(c,"artAtk");
  if (u.kind==="air") am+=M(c,"airAtk");
  if (u.kind==="land"){ const dl=drillLv(a,p.terrain); am+=0.12*dl; dm+=0.12*dl; }
  if (gen){ if(gen.tk==="atk") am+=gen.tv; if(gen.tk==="def") dm+=gen.tv; if((gen.tk==="mountain"&&p.terrain==="mountain")||(gen.tk==="desert"&&p.terrain==="desert")){am+=gen.tv;dm+=gen.tv;} }
  return [am,dm]; }
function armyPowerAt(a,p,defending,enemyAA=0){
  const c=C[a.owner]; if (!c) return 0; let s=0;
  for (const k in a.units){ const n=a.units[k]; if (n<=0) continue; const u=UNITS[k]; let [am,dm]=powerMods(a,p,k);
    let v=n*(u.atk*am+u.def*dm)/2;
    if (u.kind==="naval") v *= p.coastal?0.35:0;
    if (k==="bomber") v *= 1-enemyAA;
    s+=v; }
  s *= (0.5+0.5*a.org/100) * (c.shortage&&c.shortage.oil?0.75:1);
  if (defending){ s *= TERRAIN[p.terrain].def*(1+0.25*(p.bld.fort||0)); }
  return s;
}
function armyPower(a){ return armyPowerAt(a,P[a.prov],false); }
function sidePower(side,p,defending,enemyAA,airMult){ let s=0; for (const a of side) s+=armyPowerAt(a,p,defending,enemyAA); return s*airMult; }
function sideAir(side){ let f=0; for (const a of side) f+=(a.units.fighter||0)*UNITS.fighter.atk*(1+M(C[a.owner],"airAtk")); return f; }
function sideAA(side,p,defending){ return Math.min(0.8, side.reduce((s,a)=>s+(a.units.aa||0),0)*0.04 + (defending?(p.bld.aadef||0)*0.3:0)); }
// Predict a fight between an attacking army and whatever enemies sit in a province
function predictAttack(a,pid){
  const p=P[pid]; const enemies=G.armies.filter(b=>b.prov===pid && atWar(b.owner,a.owner) && armySize(b)>0.05);
  if (!enemies.length) return null;
  const defending = (x)=> x.owner===p.ctrl || isAlly(x.owner,p.ctrl);
  const aaE=sideAA(enemies,p,true), aaA=sideAA([a],p,false); const fa=sideAir([a]), fe=sideAir(enemies);
  const sup=0.2*(fa-fe)/(fa+fe+1);
  const PA=armyPowerAt(a,p,false,aaE)*(1+sup), PE=enemies.reduce((s,b)=>s+armyPowerAt(b,p,defending(b),aaA),0)*(1-sup);
  return {mine:PA, theirs:PE, win: PA>PE};
}
function resolveBattles(){
  const byProv=new Map(); for (const a of G.armies){ a.battle=false; if (armySize(a)<0.05) continue; let l=byProv.get(a.prov); if(!l){l=[];byProv.set(a.prov,l);} l.push(a); }
  G.battles={};
  for (const [pid,list] of byProv){
    if (list.length<2) continue; const owners=[...new Set(list.map(a=>a.owner))]; if (owners.length<2) continue;
    let A=null,B=null; for (const o of owners){ const e=owners.find(x=>atWar(o,x)); if(e){A=o;B=e;break;} } if(!A) continue;
    const sideA=list.filter(a=>a.owner===A || (isAlly(a.owner,A)&&atWar(a.owner,B)) || (!atWar(a.owner,A) && atWar(a.owner,B)));
    const sideB=list.filter(a=>!sideA.includes(a) && (a.owner===B || atWar(a.owner,A)));
    if (!sideA.length||!sideB.length) continue;
    const p=P[pid]; const ct=p.ctrl;
    const aDef = sideA.some(a=>a.owner===ct||isAlly(a.owner,ct)); const bDef=!aDef;
    const aaA=sideAA(sideA,p,aDef), aaB=sideAA(sideB,p,bDef);
    const airA=sideAir(sideA), airB=sideAir(sideB); const sup=0.2*(airA-airB)/(airA+airB+1);
    const PA=sidePower(sideA,p,aDef,aaB,1+sup), PB=sidePower(sideB,p,bDef,aaA,1-sup);
    const war = G.wars.find(w=>(w.att.includes(A)&&w.def.includes(B))||(w.def.includes(A)&&w.att.includes(B)));
    G.battles[pid]={A,B,PA,PB,sideA:sideA.map(a=>a.id),sideB:sideB.map(a=>a.id)};
    // Overrun: a force 8x stronger wipes out the weaker one immediately
    let overrun=null; if (PA>=PB*8) overrun=sideB; else if (PB>=PA*8) overrun=sideA;
    // Each side loses a share proportional to the enemy's power divided by its own
    const lossA = overrun===sideA?1:Math.min(0.3, 0.02*PB/Math.max(PA,0.01)), lossB = overrun===sideB?1:Math.min(0.3, 0.02*PA/Math.max(PB,0.01));
    const apply=(side,loss)=>{ let men=0; for (const a of side){ a.battle=true; for (const k in a.units){ const u=UNITS[k]; const f=loss>=1?1:loss*(u.kind==="air"?0.5:u.kind==="naval"?0.3:1); const lost=a.units[k]*f; a.units[k]-=lost; men+=lost*u.mp*1000; if (a.units[k]<0.05) delete a.units[k]; } a.org=Math.max(0,a.org-loss*250); } return men; };
    const menA=apply(sideA,lossA), menB=apply(sideB,lossB);
