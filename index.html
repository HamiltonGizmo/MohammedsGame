  computeEconomy(c,true); c.treasury=c.gdp*0.04+1;
  mapDirty(true);
  return c;
}

// ---------- DIPLOMACY ----------
function strengthRatio(a,b){ return (milStrength(a)+1)/(milStrength(b)+1); }
const DIPLO = {
  improve:{name:"Improve Relations",di:10,desc:"+15 relations",can:(a,b)=>getRel(a,b)<100 && !atWar(a,b), run:(a,b)=>{ addRel(a,b,15); return [true,"Relations improved by 15."]; }},
  insult:{name:"Damage Relations",di:0,desc:"-25 relations",can:(a,b)=>true, run:(a,b)=>{ addRel(a,b,-25); return [true,"Relations worsened by 25."]; }},
  alliance:{name:"Propose Alliance",di:25,desc:"Invite into your faction (or form one)",can:(a,b)=>!isAlly(a,b)&&!atWar(a,b)&&!C[b].overlord&&!C[a].overlord,
    ai:(a,b)=>getRel(a,b)>55 && !G.wars.some(w=>(w.att.includes(a)||w.def.includes(a)) && (w.att.includes(b)||w.def.includes(b))) && !allianceOf(b),
    run:(a,b)=>{ let al=allianceOf(a); if(!al){ al={id:G.nextId++,name:(C[a].name.length<16?C[a].name:C[a].tag)+" Pact",color:C[a].color,members:[a],leader:a}; G.alliances.push(al);} if(!al.members.includes(b)) al.members.push(b); addRel(a,b,10); return [true,C[b].name+" joined the "+al.name+"."]; }},
  nap:{name:"Non-Aggression Pact",di:10,desc:"Neither side may attack without breaking the pact",can:(a,b)=>!C[a].nap[b]&&!atWar(a,b), ai:(a,b)=>getRel(a,b)>-10, run:(a,b)=>{ C[a].nap[b]=true; C[b].nap[a]=true; addRel(a,b,5); return [true,"Non-aggression pact signed."]; }},
  defpact:{name:"Defensive Pact",di:15,desc:"Each joins if the other is attacked",can:(a,b)=>!C[a].defPact[b]&&!atWar(a,b), ai:(a,b)=>getRel(a,b)>40 && strengthRatio(a,b)>0.2, run:(a,b)=>{ C[a].defPact[b]=true; C[b].defPact[a]=true; addRel(a,b,8); return [true,"Defensive pact signed."]; }},
  trade:{name:"Trade Agreement",di:8,desc:"+GDP and trade income for both",can:(a,b)=>!C[a].tradeAg[b]&&!atWar(a,b)&&!C[a].sanction[b]&&!C[b].sanction[a], ai:(a,b)=>getRel(a,b)>5 && Object.keys(C[b].tradeAg).length<8, run:(a,b)=>{ C[a].tradeAg[b]=true; C[b].tradeAg[a]=true; addRel(a,b,5); return [true,"Trade agreement signed."]; }},
  guarantee:{name:"Guarantee Independence",di:15,desc:"You will defend them if attacked",can:(a,b)=>!C[a].guarantee[b]&&!atWar(a,b), run:(a,b)=>{ C[a].guarantee[b]=true; addRel(a,b,15); return [true,"You now guarantee "+C[b].name+"'s independence."]; }},
  access:{name:"Request Military Access",di:10,desc:"Move your armies through their territory",can:(a,b)=>!C[b].access[a]&&!atWar(a,b), ai:(a,b)=>getRel(a,b)>30, run:(a,b)=>{ C[b].access[a]=true; return [true,"Military access granted."]; }},
  support:{name:"Send Financial Aid",di:0,desc:"Give 1% of your GDP: +20 relations",can:(a,b)=>C[a].treasury>C[a].gdp*0.01, run:(a,b)=>{ const x=C[a].gdp*0.01; C[a].treasury-=x; C[b].treasury+=x; addRel(a,b,20); return [true,"Sent $"+fmtB(x)+" in aid."]; }},
  sanction:{name:"Impose Sanctions",di:5,desc:"-2% target GDP, -30 relations",can:(a,b)=>!C[a].sanction[b], run:(a,b)=>{ C[a].sanction[b]=true; delete C[a].tradeAg[b]; delete C[b].tradeAg[a]; addRel(a,b,-30); return [true,"Sanctions imposed on "+C[b].name+"."]; }},
  unsanction:{name:"Lift Sanctions",di:0,desc:"",can:(a,b)=>!!C[a].sanction[b], run:(a,b)=>{ delete C[a].sanction[b]; addRel(a,b,10); return [true,"Sanctions lifted."]; }},
  justify:{name:"Justify War Goal",di:30,desc:"After 30 days you can declare war without penalty",can:(a,b)=>!C[a].cb[b]&&!C[a].justify&&!atWar(a,b)&&!isAlly(a,b), run:(a,b)=>{ C[a].justify={target:b,done:G.day+30}; addRel(a,b,-10); return [true,"Justifying a war goal against "+C[b].name+" (30 days)."]; }},
  demand:{name:"Demand Territory",di:20,desc:"Demand a border province. Refusal gives you a war goal.",can:(a,b)=>!atWar(a,b)&&!isAlly(a,b)&&borderProvs(b,a).length>0,
    run:(a,b)=>{ const cand=borderProvs(b,a).filter(p=>p.id!==C[b].capital).sort((x,y)=>provValue(y)-provValue(x)); if(!cand.length) return [false,"No province can be demanded."]; const p=cand[0];
      const acc = C[b].isPlayer ? false : strengthRatio(a,b)>3.5 && !allianceOf(b);
      if (acc){ p.owner=p.ctrl=a; mapDirty(true); addRel(a,b,-30); return [true,C[b].name+" ceded "+p.name+" to you!"]; }
      C[a].cb[b]=true; addRel(a,b,-25); return [false,C[b].name+" rejected the demand for "+p.name+". You gained a war goal."]; }},

    run:(a,b)=>{ const acc = !C[b].isPlayer && strengthRatio(a,b)>6 && !allianceOf(b); if (acc){ C[b].overlord=a; addRel(a,b,-20); mapDirty(true); return [true,C[b].name+" submitted and became your puppet!"]; } C[a].cb[b]=true; addRel(a,b,-40); return [false,C[b].name+" rejected your ultimatum. You gained a war goal."]; }},

  freepuppet:{name:"Grant Independence",di:0,desc:"Release your puppet",can:(a,b)=>C[b].overlord===a, run:(a,b)=>{ C[b].overlord=null; addRel(a,b,30); mapDirty(true); return [true,C[b].name+" is now independent."]; }},
  leave:{name:"Leave Alliance",di:0,desc:"",can:(a,b)=>sameAlliance(a,b)&&!G.wars.some(w=>(w.att.includes(a)&&w.att.includes(b))||(w.def.includes(a)&&w.def.includes(b))), run:(a,b)=>{ const al=allianceOf(a); al.members=al.members.filter(x=>x!==a); if(al.members.length<2) G.alliances=G.alliances.filter(x=>x!==al); addRel(a,b,-20); return [true,"You left the "+al.name+"."]; }},
  breaknap:{name:"Cancel Non-Aggression Pact",di:0,desc:"",can:(a,b)=>!!C[a].nap[b], run:(a,b)=>{ delete C[a].nap[b]; delete C[b].nap[a]; addRel(a,b,-15); return [true,"Pact cancelled."]; }},
};
function borderProvs(owner, neighbor){ const r=[]; for (const p of P){ if (p.owner!==owner) continue; if (p.adj.some(q=>P[q].owner===neighbor)||p.sea.some(q=>P[q].owner===neighbor)) r.push(p); } return r; }
function doDiplo(a,b,act){
  const d=DIPLO[act]; const ca=C[a]; if (!d||!d.can(a,b)) return [false,"Not possible right now."];
  if (ca.di<d.di) return [false,"Not enough diplomatic influence ("+d.di+" needed)."];
  if (d.ai && !C[b].isPlayer && !d.ai(a,b)) { ca.di-=Math.ceil(d.di/3); return [false,C[b].name+" declined your proposal."]; }
  if (d.ai && C[b].isPlayer && !C[a].isPlayer){ pushPending(b,{type:"proposal",from:a,act}); return [true,"proposal sent"]; }
  ca.di-=d.di; return d.run(a,b);
}
function diplomacyMonthly(){
  // relation drift
  for (const k in G.rel){ const v=G.rel[k]; const [a,b]=k.split("|"); if (!C[a]||!C[b]) continue; let t=0; if (sameAlliance(a,b)) t=50; if (C[a].tradeAg[b]) t+=10; if (atWar(a,b)) t=-80; G.rel[k]+= (t-v)*0.01; }
}

// ---------- POLITICS ----------
function politicsMonthly(c){
  if (c.tax>0.32) c.stability-=0.5;
  // elections
  if (govOf(c).elections && G.day>=c.nextElection){ c.nextElection=G.day+1460;
    if (c.isPlayer) pushPending(c.tag,{type:"election"}); else { const pr=PARTIES[Math.floor(Math.random()*PARTIES.length)]; pr.f(c); } }
  // coups and civil wars
  if (!c.isPlayer || true){
    if (c.stability<18 && !["D","R","C"].includes(c.gov) && Math.random()<0.03){ c.gov="J"; c.stability=40; c.lastGovChange=G.day; if (c.isPlayer) notify("🎖️ A military coup has overthrown your government! You now lead a Military Junta.","bad"); else news("🎖️ Military coup in "+c.name+"."); }
    if (c.stability<10 && Math.random()<0.025 && ownedProvs(c.tag).length>=3) civilWar(c);
  }
}
function civilWar(c){
  const own=ownedProvs(c.tag).filter(p=>p.ctrl===c.tag && p.id!==c.capital); if (own.length<2) return;
  const cap=P[c.capital]; own.sort((a,b)=>distKm(b,cap)-distKm(a,cap));
  const n=Math.max(1,Math.round(own.length*0.3)); const rebelProvs=own.slice(0,n);
  let i=1; let tag="RB"+c.tag+i; while (C[tag] && C[tag].alive){ i++; tag="RB"+c.tag+i; }
  const govs = c.gov==="D"||c.gov==="R"? "X" : "R";
  CDATA[tag]={tag,name:"Free "+c.baseName,capitalName:rebelProvs[0].name,pop:1,gdp:1,gov:govs,rel:c.rel,generated:true};
  const r=spawnCountry(tag,"Free "+c.baseName,c,{gov:govs,color:shade(c.color,-30),stability:60});
  for (const p of rebelProvs){ p.owner=p.ctrl=tag; p.occ=0; }
  r.capital=rebelProvs[0].id;
  let land=0; for (const a of G.armies) if (a.owner===c.tag){ for (const k in a.units) if(UNITS[k].kind==="land"){ const mv=a.units[k]*0.4; a.units[k]-=mv; land+=mv*UNITS[k].atk/4; } }
  createArmy(tag, r.capital, {inf:Math.max(3,Math.round(land))}, r.generals[0]);
  computeEconomy(r,true);
  declareWar(tag,c.tag,{civil:true,name:"Civil War in "+c.baseName,goal:"Independence"});
  c.stability=Math.max(c.stability,25);
  const msg="🔥 Civil war erupts in "+c.name+"! Rebels have seized "+n+" provinces.";
  if (c.isPlayer) { notify(msg,"bad"); sfx("war"); } else news(msg);
  mapDirty(true);
}
function changeGov(c,g){ if (c.gov===g) return [false,"Already that government."]; if (G.day-c.lastGovChange<365) return [false,"You changed government less than a year ago."]; c.gov=g; c.stability-=15; c.approval-=10; c.lastGovChange=G.day; if(GOVS[g].elections) c.nextElection=G.day+1460; return [true,"Government changed to "+GOVS[g].name+"."]; }

// ---------- FORMABLES ----------
function formableProgress(tag, f){
  const reqTags = f.req.filter(t=>P.some(p=>p.core===t)); if (!reqTags.length) return {have:0,total:0,ok:false,reqTags};
  let have=0,total=0; const missing=new Set();
  for (const p of P){ if (!reqTags.includes(p.core)) continue; total++; if (p.owner===tag) have++; else missing.add(p.core); }
  return {have,total,ok:have===total && total>0, reqTags, missing:[...missing]};
}
function canForm(tag, id){ const c=C[tag]; if (c.formed.includes(id)) return false; const f=FORMABLES[id]; if (id==="uae" && tag==="ARE") return false; return formableProgress(tag,f).ok; }
function formNation(tag, id){
  const c=C[tag], f=FORMABLES[id]; if (!canForm(tag,id)) return false;
  c.formed.push(id); c.name=f.name; c.flag=f.flag; c.color=f.color;
  for (const k in f.bonus) c.mods[k]=(c.mods[k]||0)+f.bonus[k];
  for (const p of P) if (f.req.includes(p.core) && p.owner===tag) p.resist=0;
  mapDirty(true);
  if (c.isPlayer){ ui && ui.formationAnim && ui.formationAnim(c,f); sfx("form"); } else news("👑 "+C[tag].name+" has been proclaimed by the former "+c.baseName+"!");
  return true;
}
function checkFormables(){
  for (const t in C){ const c=C[t]; if (!c.alive) continue;
    for (const id in FORMABLES){ if (c.formed.includes(id)) continue; const f=FORMABLES[id]; if (!f.req.includes(c.tag) && !f.req.some(r=>P.some(p=>p.core===r&&p.owner===t))) continue;
      if (canForm(t,id)){ if (c.isPlayer){ if (!c.formNotified) c.formNotified={}; if(!c.formNotified[id]){ c.formNotified[id]=true; notify("👑 You can now form the "+f.name+"! Open the Formables menu.","good"); sfx("tech"); } } else if (Math.random()<0.5) formNation(t,id); } } }
}

function eventsMonthly(){

// ---------- MILITARY ACTIONS ----------
function queueBuild(c, pid, k){
  const p=P[pid], b=BUILDINGS[k]; if (p.owner!==c.tag) return [false,"You don't own this province."];
  if (b.coastal && !p.coastal) return [false,"Requires a coastal province."];
  if (b.req && !c.techs[b.req]) return [false,"Requires "+TECHS[b.req][0]+"."];
  const queued=c.buildQ.filter(q=>q.prov===pid&&q.b===k).length; if ((p.bld[k]||0)+queued>=b.max) return [false,"Maximum level reached."];
  const cost=bCost(c,k); if (c.treasury<cost) return [false,"Not enough money ($"+fmtB(cost)+" needed)."];
  c.treasury-=cost; c.buildQ.push({prov:pid,b:k,prog:0,total:b.days}); return [true,b.name+" queued in "+p.name+"."];
}
function canRecruit(c,k,pid){
  const u=UNITS[k], p=P[pid]; if (p.owner!==c.tag||p.ctrl!==c.tag) return "Province not under your control.";
  if (u.req && !c.techs[u.req]) return "Requires "+TECHS[u.req][0];
  if (u.bld==="milfac" && !countBld(c.tag,"milfac")) return "Requires a Military Factory";
  if (u.bld==="airbase" && !(p.bld.airbase)) return "Requires an Airbase here";
  if (u.bld==="dockyard" && !(p.bld.dockyard)) return "Requires a Naval Dockyard here";
  if (u.bld==="port" && !(p.bld.port||p.bld.dockyard)) return "Requires a Port here";
  if (c.bankrupt) return "Bankrupt";
  return null;
}
function recruit(c,k,n,pid){
  const err=canRecruit(c,k,pid); if (err) return [false,err];
  const u=UNITS[k]; const cost=uCost(c,k)*n, mp=u.mp*1000*n;
  let resCost=0; for (const r of ["steel","oil"]){ const need=(u[r]||0)*n*0.1; const have=Math.max(0,c.stock[r]||0); if (have<need) resCost+=(need-have)*G.market.price[r]*1.1; }
  if (c.treasury<cost+resCost) return [false,"Not enough money ($"+fmtB(cost+resCost)+" needed)."];
  if (c.manpower<mp) return [false,"Not enough manpower ("+fmtN(mp)+" needed)."];
  c.treasury-=cost+resCost; c.manpower-=mp; for (const r of ["steel","oil"]){ const need=(u[r]||0)*n*0.1; c.stock[r]=Math.max(0,(c.stock[r]||0)-need); }
  c.recruitQ.push({u:k,n,prov:pid,prog:0,total:u.days}); return [true,"Training "+n+"× "+u.name+"."];
}
function missileStrike(c, pid, nuke){
  const p=P[pid]; if (!countBld(c.tag,"missile")) return [false,"You need a Missile Facility."];
  if (nuke && !c.techs.nuc1) return [false,"Requires Nuclear Weapons."];
  if (!atWar(c.tag,p.ctrl) && !atWar(c.tag,p.owner)) return [false,"You can only strike enemies you are at war with."];
  if (c.missileCd>0) return [false,"Missile forces are rearming ("+c.missileCd+" days)."];
  const cost = nuke? 20 : 3; if (c.treasury<cost) return [false,"Not enough money ($"+cost+"B)."];
  c.treasury-=cost; c.missileCd = nuke?90:30;
  const kill = nuke?0.75:0.12;
  for (const a of G.armies) if (a.prov===pid && atWar(a.owner,c.tag)) for (const k in a.units) a.units[k]*=1-kill;
  if (nuke){ p.bld={}; p.pop*=0.5; p.base*=0.4; c.stability-=20; for (const t in C){ if (t!==c.tag && C[t].alive) addRel(t,c.tag,-40); } G.worldTension+=30; sfx("nuke"); notify("☢️ Nuclear strike on "+p.name+". The world is horrified.","war",pid); news("☢️ "+c.name+" launched a nuclear strike on "+p.name+"!"); }

// ---------- SAVE / LOAD ----------
function serialize(){
  const prov = P.map(p=>[p.owner,p.ctrl,p.bld,+p.occ.toFixed(1),+p.resist.toFixed(1),+p.base.toFixed(4),+p.pop.toFixed(5),p.res,p.core]);
  return JSON.stringify({v:1,mapId:MAP_ID,nprov:P.length,G:Object.assign({},G,{sel:null}),C,CDATA_extra:Object.fromEntries(Object.entries(CDATA).filter(([k,v])=>v.generated||k.startsWith("RB"))),prov});
}
function deserialize(str){
  const s=JSON.parse(str); if (s.mapId!==MAP_ID || s.nprov!==P.length) throw new Error("This save was made with a different world map.");
  Object.assign(CDATA, s.CDATA_extra||{}); G=s.G; C=s.C; G.pendingEvents=G.pendingEvents||[]; if (!s.keepPlayers) for (const t in C) C[t].isPlayer=(t===G.player); G.mp=null;
  s.prov.forEach((r,i)=>{ const p=P[i]; [p.owner,p.ctrl,p.bld,p.occ,p.resist,p.base,p.pop,p.res,p.core]=r; });
  mapDirty(true);
}
function saveGame(slot){ try{ localStorage.setItem("wd_save_"+slot, serialize()); localStorage.setItem("wd_save_meta_"+slot, JSON.stringify({date:dateStr(G.day),country:G.player?C[G.player].name:"Spectator",real:Date.now()})); return true; }catch(e){ return false; } }
function loadSlot(slot){ try{ const s=localStorage.getItem("wd_save_"+slot); if(!s) return false; deserialize(s); return true; }catch(e){ alertBox("Could not load save: "+e.message); return false; } }

async function exportCode(){ const s=serialize(); try{ if (window.CompressionStream){ const cs=new Blob([s]).stream().pipeThrough(new CompressionStream("gzip")); const buf=new Uint8Array(await new Response(cs).arrayBuffer()); let bin=""; for (let i=0;i<buf.length;i+=8192) bin+=String.fromCharCode.apply(null,buf.subarray(i,i+8192)); return "WDZ1:"+btoa(bin); } }catch(e){} return "WDJ1:"+btoa(unescape(encodeURIComponent(s))); }

// ================= AI =================
function aiCountries(){ const r=[]; for (const t in C){ const c=C[t]; if (c.alive && !c.isPlayer) r.push(c); } return r; }
function enemyArmyStrengthAt(tag,pid){ const p=P[pid]; let s=0; for (const a of G.armies) if (a.prov===pid && atWar(a.owner,tag)) s+=armyPowerAt(a,p,a.owner===p.ctrl||isAlly(a.owner,p.ctrl)); return s; }
function armyStrength(a){ return armyPower(a); }

function aiDaily(){
  if (G.day%2!==0) return;
  for (const w of G.wars){
    for (const t of w.att.concat(w.def)){
      const c=C[t]; if (!c||!c.alive||c.isPlayer) continue;
      if ((hashStr(t)+G.day/2)%2!==0) continue;
      const enemies = w.att.includes(t)? w.def : w.att;
      const armies = G.armies.filter(a=>a.owner===t && !a.battle && !a.retreating && !a.path.length && landSize(a)>0.5);
      armies.forEach((a,i)=>aiArmyOrder(a,c,enemies,i));
    }
  }
}
function aiArmyOrder(a,c,enemies,i,filter){
  if (a.training) return;
  if (hostileProv(a.owner,a.prov)) return; // occupying
  if (a.org<35) return; // recovering
  const cap=P[c.capital];
  const ok = q => hostileProv(a.owner,q) && (!filter || filter(q));
  // defend the capital if threatened
  if (!filter && i===0 && cap && cap.ctrl===c.tag){ const threat=cap.adj.some(q=>G.armies.some(b=>b.prov===q && atWar(b.owner,c.tag))); if (threat && a.prov!==cap.id){ orderMove(a,cap.id); return; } }
  const myS=armyPower(a);
  // adjacent targets
  let best=null,bs=-1e9; const here=P[a.prov];
  const neigh = here.adj.concat(armyCaps(a).seaOK?here.sea:[]);
  for (const q of neigh){ if (!ok(q)) continue; const es=enemyArmyStrengthAt(a.owner,q); if (es>=armyPowerAt(a,P[q],false)) continue; const sc=provValue(P[q])*0.2 - es*0.05 + (P[q].core===c.tag?30:0) + (q===C[P[q].ctrl]?.capital?20:0) - q*1e-6; if (sc>bs){bs=sc;best=q;} }
  if (best!==null){ orderMove(a,best); return; }
  // otherwise head to the nearest enemy-held province
  const cands=[]; for (const p of P){ if (!ok(p.id) || enemyArmyStrengthAt(a.owner,p.id)>=myS) continue; cands.push([distKm(here,p),p.id]); }
  cands.sort((x,y)=>x[0]-y[0]);
  const off = filter ? (i||0)%Math.max(1,Math.min(3,cands.length)) : 0;
  for (let k=0;k<Math.min(8,cands.length);k++){ if (orderMove(a,cands[(k+off)%cands.length][1])) return true; }
  return false;
}

// ---------- auto-invasion (player "Capture" orders) ----------
function invadeFilter(target){ return target==="all" ? null : (q=>P[q].owner===target); }
function invasionDone(owner,target){ if (target==="all") return !P.some(p=>hostileProv(owner,p.id)); if (!C[target]||!C[target].alive||!atWar(owner,target)) return true; return !P.some(p=>p.owner===target && hostileProv(owner,p.id)); }
function autoArmies(){

    if (!a.auto) return;
    const key=a.owner+"|"+a.auto;
    if (done[key]===undefined) done[key]=invasionDone(a.owner,a.auto);
    if (done[key]){ const t=a.auto; a.auto=null; if (a.owner===G.player && !done[key+"n"]){ done[key+"n"]=true; notify(t==="all"?"🏁 Invasion complete: no enemy territory left to capture.":"🏁 Invasion of "+(C[t]?C[t].name:t)+" complete.","good"); } return; }
    if (a.battle||a.retreating||a.path.length||landSize(a)<0.3) return;
    aiArmyOrder(a,C[a.owner],null,i,invadeFilter(a.auto));

}
// AI terrain training
function aiTraining(c){ if (Math.random()>0.06 || c.treasury<c.gdp*0.05+1 || atWarAny(c.tag)) return; const a=G.armies.find(x=>x.owner===c.tag&&!x.path.length&&!x.battle&&!x.training&&landSize(x)>1); if (!a) return; const cnt={}; for (const p of ownedProvs(c.tag)) cnt[p.terrain]=(cnt[p.terrain]||0)+1; const t=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0]; if (t) startTraining(a,t); }

function aiMonthly(){
  const settings=G.settings.aiAggr; let aiWars=G.wars.filter(w=>!w.att.concat(w.def).includes(G.player)).length;
  for (const c of aiCountries()){
    const t=c.tag;
    // taxes
    if (c.net<0 && c.stability>40) c.tax=Math.min(0.35,c.tax+0.02); else if (c.stability<35) c.tax=Math.max(0.1,c.tax-0.02); else if (c.net>c.gdp*0.01 && c.tax>0.18) c.tax-=0.01;
    aiTraining(c);
    // research
    for (let i=0;i<c.research.length;i++){ if (c.research[i]) continue; const avail=Object.keys(TECHS).filter(id=>!c.techs[id] && !c.research.some(r=>r&&r.id===id) && TECHS[id][3].every(q=>c.techs[q])); if (avail.length){ avail.sort((x,y)=>TECHS[x][2]-TECHS[y][2]); const pick=avail[Math.floor(Math.random()*Math.min(4,avail.length))]; c.research[i]={id:pick,prog:0}; } }
    // construction
    const own=ownedProvs(t).filter(p=>p.ctrl===t); if (!own.length) continue;
    const reserve=c.gdp*0.01+0.3;
    const rich = c.treasury > c.gdp*0.25+2;
    if (c.treasury > c.gdp*0.15 && c.debt>0){ const x=Math.min(c.debt,(c.treasury-c.gdp*0.1)*0.5); c.debt-=x; c.treasury-=x; }
    const slotsAI = 2+Math.floor(countBld(t,"factory")/4);
    for (let tries=0; tries<(rich?3:1); tries++) if (c.buildQ.length<(rich?slotsAI+1:2) && c.treasury>reserve){
      const focus = atWarAny(t)?"mil":c.ai.focus; let opts;
      if (focus==="eco") opts=["factory","commercial","infra","factory","farm","mine","port"]; else if (focus==="sci") opts=["university","lab","factory","infra","commercial"]; else opts=["milfac","factory","fort","airbase","infra","commercial"];
      const k=opts[Math.floor(Math.random()*opts.length)];
      const sorted=own.slice().sort((a,b)=>b.base-a.base);
      for (const p of sorted.slice(0,4)){ if (c.treasury<bCost(c,k)+reserve) break; const [ok]=queueBuild(c,p.id,k); if (ok) break; }
    }
    // recruitment
    const land = G.armies.filter(a=>a.owner===t).reduce((s,a)=>s+landSize(a),0);
    const desired = (2+Math.sqrt(Math.max(0,c.gdp))*0.6)*(atWarAny(t)?1.6:1)*(1+c.ai.aggr*0.5)*(rich?1.3:1);
    const queued=c.recruitQ.reduce((s,q)=>s+q.n,0);
    if (land+queued<desired && c.treasury>reserve){
      const cap=P[c.capital].owner===t&&P[c.capital].ctrl===t?c.capital:own[0].id;
      let k="inf"; if (c.techs.armor2 && countBld(t,"milfac") && Math.random()<0.35) k="tank"; else if (countBld(t,"milfac") && Math.random()<0.25) k="art"; else if (c.techs.armor1 && countBld(t,"milfac") && Math.random()<0.25) k="mech";
      const n=Math.max(1,Math.min(Math.ceil(desired-land-queued), Math.floor((c.treasury-reserve)/uCost(c,k)), Math.floor(c.manpower/(UNITS[k].mp*1000)), 12));
      if (n>0) recruit(c,k,n,cap);
    }
    // merge idle armies sitting together at home
    const idle=G.armies.filter(a=>a.owner===t&&!a.path.length&&!a.battle);
    for (let i=0;i<idle.length;i++) for (let j=i+1;j<idle.length;j++){ if (idle[i].prov===idle[j].prov && armySize(idle[j])>0){ for (const k in idle[j].units) idle[i].units[k]=(idle[i].units[k]||0)+idle[j].units[k]; idle[j].units={}; } }
    // diplomacy
    if (Math.random()<0.15){ const nb=neighborsOf(t).filter(x=>C[x]&&C[x].alive&&!C[x].isPlayer); if (nb.length){ const b=nb[Math.floor(Math.random()*nb.length)]; const r=getRel(t,b);
      if (r>25 && !c.tradeAg[b]) doDiplo(t,b,"trade"); else if (r>65 && !isAlly(t,b) && !allianceOf(b) && Math.random()<0.3) doDiplo(t,b,"alliance"); else if (r>-20 && r<40 && c.di>20) doDiplo(t,b,"improve"); else if (r<-40 && !c.nap[b] && strengthRatio(b,t)>1.5) doDiplo(t,b,"nap"); } }
    // war declarations
    if (!atWarAny(t) && settings!=="peaceful" && G.day>60){
      const thr = settings==="aggressive"? 0.35 : 0.6; const ch = settings==="aggressive"? 0.03 : 0.012;
      const cap = settings==="aggressive"? 8 : 3;
      if (c.ai.aggr>thr && Math.random()<ch*(c.ai.aggr+0.3) && aiWars<cap && G.day-c.ai.lastWar>(settings==="aggressive"?360:720) && c.stability>30 && !c.overlord){
        const relT = settings==="aggressive"? 15 : -10;
        const nb=neighborsOf(t).filter(b=>C[b]&&C[b].alive&&!isAlly(t,b)&&!inTruce(t,b)&&!c.nap[b]&&!C[b].overlord&&getRel(t,b)< (C[b].isPlayer?Math.min(-30,relT):relT));
        let target=null,best=0;
        for (const b of nb){ let defS=milStrength(b); const al=allianceOf(b); if (al) for (const m of al.members) if (m!==b) defS+=milStrength(m)*0.5; for (const x in C) if (C[x].alive&&(C[x].defPact[b]||C[x].guarantee[b])) defS+=milStrength(x)*0.5;
          const ratio=(milStrength(t)+1)/(defS+1); const need=(C[b].isPlayer?2.0:1.6)*(settings==="aggressive"?0.8:1); if (ratio>need){ const sc=ratio*sideValue([b]); if (sc>best){best=sc;target=b;} } }
        if (target){ if (!c.cb[target]) c.cb[target]=true; const w=declareWar(t,target,{goal:"Conquest"}); if (w){ c.ai.lastWar=G.day; aiWars++; } }
      }
    }
  }
  // peace decisions

    const plIn = playerTags().filter(t=>w.att.includes(t)||w.def.includes(t));

      if (pScore<-45){ const annex=P.filter(p=>p.owner===pl && p.ctrl!==pl && (w.att.includes(p.ctrl)||w.def.includes(p.ctrl))).map(p=>p.id); if (annex.length) pushPending(pl,{type:"peaceDemand",war:w.id,from:enemyLeader,annex}); }
      else if (pScore>45){ const annex=P.filter(p=>p.owner===enemyLeader && p.ctrl===pl).map(p=>p.id); if (annex.length) pushPending(pl,{type:"peaceOffer",war:w.id,from:enemyLeader,annex}); }
      else if (dur>720 && Math.abs(pScore)<20) pushPending(pl,{type:"whiteOffer",war:w.id,from:enemyLeader});
    }
  }
}

const FLAG_CACHE = new Map();

function drawStar(ctx,cx,cy,r,col,pts=5){ ctx.fillStyle=col; ctx.beginPath(); for (let i=0;i<pts*2;i++){ const rr=i%2?r*0.45:r; const a=-Math.PI/2+i*Math.PI/pts; ctx.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr); } ctx.closePath(); ctx.fill(); }

function tabbed(prefix,tabs,cur){ return '<div class="tabs big">'+tabs.map(([k,n])=>'<button class="'+(cur===k?'on':'')+'" data-a="panel" data-v="'+prefix+':'+k+'">'+n+'</button>').join("")+'</div>'; }
PANELS.country = tag=>{
  const c=C[tag]; if (!c) return ["Unknown",""]; const pl=G.player; const me=tag===pl;
  const own=ownedProvs(tag); const al=allianceOf(tag); const [diff,dc]=difficulty(tag);
  let h='<div class="chead">'+flagImg(c,"flag huge")+'<div><h2>'+esc(c.name)+'</h2><div class="muted">'+govOf(c).name+' · '+RELIGIONS[c.rel][0]+(c.overlord?' · Puppet of '+esc(C[c.overlord].name):'')+'</div>'+(al?'<div class="chip" style="border-color:'+al.color+'">'+esc(al.name)+'</div>':'')+'</div></div>';
  h+='<div class="grid2">'+stat("Capital",esc(P[c.capital]?P[c.capital].name:"–"))+stat("Population",fmtPop(c.pop))+stat("GDP","$"+fmtB(c.gdp))+stat("GDP / capita","$"+fmtN(c.gdp*1e9/(c.pop*1e6+1)))+stat("Military",fmtN(milStrength(tag)))+stat("Provinces",own.length)+stat("Stability",Math.round(c.stability)+"%")+stat("Technologies",Object.keys(c.techs).length)+'</div>';
  if (!pl || me){ h+= me? '<div class="row"><button class="btn" data-a="focusC" data-v="'+tag+'">🎯 Show on map</button><button class="btn" data-a="panel" data-v="economy">💰 Economy</button><button class="btn" data-a="panel" data-v="military">🪖 Military</button></div>' : '<div class="row"><button class="btn" data-a="focusC" data-v="'+tag+'">🎯 Show on map</button><button class="btn" data-a="compare" data-v="'+tag+'">📊 Compare</button></div>'; return [esc(c.name),h]; }
  const r=getRel(tag,pl);
  const mp=milStrength(pl), tp=milStrength(tag); let allyP=0; const al2=allianceOf(tag); if (al2) for (const m of al2.members) if (m!==tag) allyP+=milStrength(m);
  h+='<h4>Military power</h4><div class="pcmp"><div><b>'+fmtN(mp)+'</b><small>You</small></div><div class="pbar"><i style="width:'+(mp/(mp+tp+1)*100).toFixed(1)+'%"></i></div><div><b>'+fmtN(tp)+'</b><small>'+esc(c.name)+'</small></div></div><p class="verdict '+(mp>tp*1.2?'pos':mp<tp?'neg':'')+'">'+(mp>tp*2?"You are much stronger.":mp>tp*1.2?"You are stronger.":mp>=tp?"You are about equal.":"They are stronger than you.")+(allyP?" Their allies add "+fmtN(allyP)+" more power.":"")+'</p>';
  h+='<h4>Relations with '+esc(C[pl].name)+'</h4><div class="relrow"><b style="color:'+relCol(r)+'">'+Math.round(r)+' · '+relLabel(r)+'</b>'+bar(r+100,200,relCol(r))+'</div>';
  const tags=[]; if (atWar(tag,pl)) tags.push('<span class="chip red">At war</span>'); if (isAlly(tag,pl)) tags.push('<span class="chip green">Ally</span>'); if (C[pl].nap[tag]) tags.push('<span class="chip">Non-aggression</span>'); if (C[pl].defPact[tag]) tags.push('<span class="chip">Defensive pact</span>'); if (C[pl].tradeAg[tag]) tags.push('<span class="chip">Trade</span>'); if (C[pl].guarantee[tag]) tags.push('<span class="chip">Guaranteed</span>'); if (C[tag].access[pl]) tags.push('<span class="chip">Military access</span>'); if (C[pl].sanction[tag]) tags.push('<span class="chip red">Sanctioned</span>'); if (C[pl].cb[tag]) tags.push('<span class="chip gold">War goal</span>'); if (inTruce(tag,pl)) tags.push('<span class="chip">Truce</span>');
  if (tags.length) h+='<div class="chips">'+tags.join("")+'</div>';
  const MAIN=["improve","alliance","trade","nap","justify"];
  const dbtn=k=>{ const d=DIPLO[k]; return '<button class="dbtn" data-a="diplo" data-v="'+k+'" data-t="'+tag+'" title="'+esc(d.desc)+'"><b>'+d.name+'</b><small>'+(d.di?"🕊️ "+d.di:"free")+(d.desc?" · "+esc(d.desc):"")+'</small></button>'; };
  const avail=Object.keys(DIPLO).filter(k=>DIPLO[k].can(pl,tag));
  h+='<h4>Diplomacy <small class="muted">(you have 🕊️ '+Math.floor(C[pl].di)+' influence)</small></h4><div class="dgrid">'+avail.filter(k=>MAIN.includes(k)).map(dbtn).join("")+'</div>';
  const more=avail.filter(k=>!MAIN.includes(k)); if (more.length) h+='<details><summary>More diplomatic actions ('+more.length+')</summary><div class="dgrid">'+more.map(dbtn).join("")+'</div></details>';
  if (atWar(tag,pl)){ const w=G.wars.find(w=>(w.att.includes(pl)&&w.def.includes(tag))||(w.def.includes(pl)&&w.att.includes(tag))); h+='<div class="invade"><button class="btn red big" data-a="invade" data-v="'+tag+'">⚔️ Capture '+esc(c.name)+'</button><button class="btn red" data-a="invade" data-v="all">⚔️ Capture all enemies</button><small class="muted">Sends all your land armies to automatically conquer every province.</small></div>';
    h+='<div class="row"><button class="btn gold" data-a="peaceUI" data-v="'+w.id+'" data-t="'+tag+'">🕊️ Negotiate Peace</button><button class="btn" data-a="panel" data-v="war:'+w.id+'">⚔️ War details</button></div>'; }
  else if (!isAlly(tag,pl)) { const pen = C[pl].cb[tag]? "Justified — no penalty" : (C[pl].nap[tag]?"Breaks pact: -15 stability":"Unjustified: -10 stability, world relations drop"); h+='<div class="row"><button class="btn red" data-a="declareWar" data-t="'+tag+'">⚔️ Declare War</button><small class="muted">'+pen+(inTruce(tag,pl)?" · breaks truce":"")+'</small></div>'; }
  h+='<div class="row"><button class="btn" data-a="focusC" data-v="'+tag+'">🎯 Show on map</button><button class="btn" data-a="compare" data-v="'+tag+'">📊 Compare</button></div>';
  return [esc(c.name),h];
};
PANELS.prov = id=>{
  const p=P[+id]; if (!p) return ["",""]; const c=C[p.owner], ct=C[p.ctrl]; const pl=G.player; const mine=p.owner===pl && p.ctrl===pl;
  let h='<div class="chead sm" data-a="panel" data-v="country:'+p.owner+'">'+flagImg(c,"flag big")+'<div><h3>'+esc(p.name)+(C[p.owner]&&C[p.owner].capital===p.id?' ★':'')+'</h3><div class="muted">'+esc(c.name)+(p.ctrl!==p.owner?' · <span class="red">occupied by '+esc(ct?ct.name:p.ctrl)+'</span>':'')+(p.core!==p.owner?' · core of '+esc(CDATA[p.core]?CDATA[p.core].name:p.core):'')+'</div></div><span class="go">›</span></div>';
  h+='<div class="grid2">'+stat("Terrain",TERRAIN_NAMES[p.terrain])+stat("Population",fmtPop(p.pop))+stat("Province GDP","$"+fmtB(provGDP(p)))+stat("Coastal",p.coastal?"Yes":"No")+(p.resist>1?stat("Resistance",Math.round(p.resist)+"%","neg"):"")+(p.occ>0?stat("Occupation",Math.round(p.occ)+"%","neg"):"")+'</div>';
  const res=Object.entries(p.res).filter(([k,v])=>v>0.05); if (res.length) h+='<h4>Resources</h4><div class="chips">'+res.map(([k,v])=>'<span class="chip" style="border-color:'+RES_COLORS[k]+'">'+RES_NAMES[k]+' '+v.toFixed(1)+'</span>').join("")+'</div>';
  h+='<h4>Buildings</h4><div class="blist">';
  for (const k of BLD_KEYS){ const b=BUILDINGS[k]; const lv=p.bld[k]||0; if (!mine && !lv) continue; if (b.coastal&&!p.coastal&&!lv) continue;
    const q = pl? C[pl].buildQ.filter(x=>x.prov===p.id&&x.b===k) : []; const can = mine && lv+q.length<b.max && (!b.req||C[pl].techs[b.req]);
    h+='<div class="brow"><span><b>'+b.name+'</b> <small class="lv">'+'▮'.repeat(lv)+'<i>'+'▯'.repeat(Math.max(0,b.max-lv))+'</i></small><br><small class="muted">'+b.desc+'</small>'+(q.length?'<br><small class="gold">⏳ '+q.map(x=>Math.round(x.prog/x.total*100)+"%").join(", ")+'</small>':'')+'</span>'+(mine?'<button class="btn sm'+(can?'':' dis')+'" data-a="build" data-v="'+k+'" data-p="'+p.id+'">+ $'+fmtB(bCost(C[pl],k))+'<small>'+b.days+'d</small></button>':'')+'</div>'; }
  h+='</div>';
  const armies=G.armies.filter(a=>a.prov===p.id);
  if (armies.length){ h+='<h4>Armies here</h4>'+armies.map(armyRow).join(""); }
  if (mine){ h+='<div class="row"><button class="btn gold" data-a="panel" data-v="recruit:'+p.id+'">🪖 Recruit here</button></div>'; }
  if (pl && p.owner===pl && p.core!==pl && CDATA[p.core] && (!C[p.core]||!C[p.core].alive)) h+='<div class="row"><button class="btn" data-a="release" data-v="'+p.core+'">🏳️ Release '+esc(CDATA[p.core].name)+' (as puppet)</button><button class="btn" data-a="releaseFree" data-v="'+p.core+'">Release as independent</button></div>';
  if (pl && (atWar(pl,p.ctrl)) && countBld(pl,"missile")) h+='<div class="row"><button class="btn red" data-a="strike" data-v="'+p.id+'">🚀 Missile strike ($3B)</button>'+(C[pl].techs.nuc1?'<button class="btn red" data-a="nuke" data-v="'+p.id+'">☢️ Nuclear strike ($20B)</button>':'')+'</div>';
  if (pl && p.owner!==pl) h+='<div class="row"><button class="btn" data-a="panel" data-v="country:'+p.owner+'">🏛️ '+esc(c.name)+' — diplomacy</button></div>';
  return [esc(p.name),h];
};
function armyRow(a){ const c=C[a.owner]; const comp=Object.entries(a.units).filter(([k,n])=>n>=0.5).map(([k,n])=>unitImg(k)+Math.round(n)).join(" "); return '<div class="arow" data-a="selArmy" data-v="'+a.id+'">'+flagImg(c,"flag")+'<span><b>'+esc(a.name)+'</b><small>'+comp+'</small></span><span class="org">'+bar(a.org,100,a.org>50?"#4ade80":a.org>25?"#facc15":"#ef4444")+'<small>'+(a.battle?"⚔️ in battle":a.training?"🎓 "+TERRAIN_NAMES[a.training.t]+" training":a.retreating?"retreating":a.auto?"⚔️ capturing "+(a.auto==="all"?"all":esc(C[a.auto]?C[a.auto].name:a.auto)):a.path.length?"→ "+esc(P[a.path[a.path.length-1]].name):"idle")+(a.drill?" · 🎓"+Object.entries(a.drill).map(([t,l])=>TERRAIN_NAMES[t][0]+l).join(""):"")+'</small></span></div>'; }
PANELS.army = id=>{
  const a=G.armies.find(x=>x.id===+id); if (!a) { return ["Army",'<p class="muted">This army no longer exists.</p>']; }
  const mine=a.owner===G.player; const c=C[a.owner]; const gen=generalOf(a);
  let h='<div class="chead sm">'+flagImg(c,"flag big")+'<div><h3>'+esc(a.name)+'</h3><div class="muted">'+esc(c.name)+' · in '+esc(P[a.prov].name)+'</div></div></div>';
  h+='<div class="bigpower"><span>⚔️ Power</span><b>'+fmtN(armyPower(a))+'</b><small>Power = units × attack & defense × tech, general, training and morale bonuses. In battle the side with more power wins.</small></div>';
  h+='<div class="grid2">'+stat("Morale (organization)",Math.round(a.org)+"%")+stat("Units",fmtN(armySize(a)))+stat("Status",a.battle?"⚔️ Fighting":a.retreating?"Retreating":a.path.length?"Moving":"Idle")+stat("Supply",a.supplied===false?'<span class="neg">Out of supply</span>':"Supplied")+'</div>';
  if (a.drill) h+='<div class="chips">'+Object.entries(a.drill).map(([t,l])=>'<span class="chip gold">'+TERRAIN_ICONS[t]+' '+TERRAIN_NAMES[t]+' '+'★'.repeat(l)+'</span>').join("")+'</div>';
  h+='<table class="tbl"><tr><th>Unit</th><th>Count</th><th>Atk</th><th>Def</th><th>Speed</th></tr>';
  for (const k in a.units){ const u=UNITS[k], n=a.units[k]; if (n<0.05) continue; h+='<tr><td>'+unitImg(k)+' '+u.name+'</td><td>'+n.toFixed(n<10?1:0)+'</td><td>'+u.atk+'</td><td>'+u.def+'</td><td>'+u.spd+'</td></tr>'; }
  h+='</table>';
  if (mine){
    h+='<p class="hint">👆 Tap any province on the map to move this army there. Armies must capture enemy provinces they enter before moving on.</p>';
    const ens=[...new Set(warsOf(a.owner).flatMap(w=>w.att.includes(a.owner)?w.def:w.att))];
    if (ens.length) h+='<h4>Invasion</h4><select data-a="armyInvade" data-v="'+a.id+'"><option value="">— manual control —</option><option value="all"'+(a.auto==="all"?" selected":"")+'>Capture all enemies</option>'+ens.map(t=>'<option value="'+t+'"'+(a.auto===t?" selected":"")+'>Capture '+esc(C[t].name)+'</option>').join("")+'</select>';
    h+='<h4>Terrain training</h4>';
    if (a.training) h+='<div class="qrow">🎓 Training for '+TERRAIN_NAMES[a.training.t]+bar(G.day-a.training.start,TRAIN_DAYS)+'<small>'+(a.training.until-G.day)+' days</small></div>';
    h+='<p class="hint">Each level gives +12% attack &amp; defense and +10% speed in that terrain (max 3). Training takes 30 days in your own territory; the army can’t move meanwhile.</p><div class="trn">'+Object.keys(TERRAIN).map(t=>{ const lv=drillLv(a,t); const err=canTrain(a,t); return '<button class="tbtn'+(err?' dis':'')+'" data-a="train" data-v="'+a.id+'" data-t="'+t+'" title="'+esc(err||"")+'"><b>'+TERRAIN_ICONS[t]+' '+TERRAIN_NAMES[t]+'</b><small class="lv">'+'▮'.repeat(lv)+'<i>'+'▯'.repeat(TRAIN_MAX-lv)+'</i></small><small>'+(lv>=TRAIN_MAX?"Max":"$"+fmtB(trainCost(a,t)))+'</small></button>'; }).join("")+'</div>';
    h+='<h4>General</h4><select data-a="assignGen" data-v="'+a.id+'"><option value="">— none —</option>'+c.generals.map(g=>'<option value="'+g.id+'"'+(a.general===g.id?' selected':'')+'>'+esc(g.name)+' ★'+g.skill+' ('+g.trait+')'+(g.army&&g.army!==a.id?' [assigned]':'')+'</option>').join("")+'</select>';
    h+='<h4>Orders</h4><div class="row"><button class="btn" data-a="armyStop" data-v="'+a.id+'">⏹ Stop</button><button class="btn" data-a="armySplit" data-v="'+a.id+'">✂️ Split</button><button class="btn" data-a="armyMerge" data-v="'+a.id+'">🔗 Merge here</button><button class="btn" data-a="armyHome" data-v="'+a.id+'">🏠 Return home</button><button class="btn red" data-a="armyDisband" data-v="'+a.id+'">Disband</button></div>';
    h+='<div class="row"><button class="btn" data-a="deselect">Deselect army</button></div>';
  } else if (gen) h+='<p class="muted">Led by '+esc(gen.name)+' ★'+gen.skill+'</p>';
  return ["Army",h];
};
PANELS.recruit = id=>{

PANELS.economy = ()=>{

function histChart(tags,idx){ const W=320,H=120; let mx=0, d0=Infinity, d1=0; for (const t of tags) for (const r of C[t].history){ mx=Math.max(mx,r[idx]); d0=Math.min(d0,r[0]); d1=Math.max(d1,r[0]); } if (!mx||d1<=d0) return '<p class="muted">Not enough history yet — check back after a few months.</p>';
  const cols=["#d4af37","#60a5fa","#f87171"]; let s='<svg viewBox="0 0 '+W+' '+H+'" class="hchart"><line x1="0" y1="'+(H-1)+'" x2="'+W+'" y2="'+(H-1)+'" stroke="#334"/>';
  tags.forEach((t,i)=>{ const pts=C[t].history.map(r=>((r[0]-d0)/(d1-d0)*W).toFixed(1)+","+(H-4-r[idx]/mx*(H-10)).toFixed(1)).join(" "); s+='<polyline points="'+pts+'" fill="none" stroke="'+cols[i]+'" stroke-width="2"/>'; });
  return s+'</svg><div class="legend">'+tags.map((t,i)=>'<span><i style="background:'+cols[i]+'"></i>'+esc(C[t].name)+'</span>').join("")+'</div>'; }

function gameOver(){ modal('<div class="evh">💀 Your nation has fallen</div><p>The sandbox continues. You can keep watching the world, or take control of another nation.</p><div class="evopts"><button class="btn gold block" data-a="switchNation">Lead another nation</button><button class="btn block" data-a="becomeSpectator">Spectate</button><button class="btn block" data-a="toMenu">Main menu</button></div>'); }
function switchNationModal(){ const list=Object.values(C).filter(x=>x.alive).sort((a,b)=>b.gdp-a.gdp); modal('<h3>🔁 Choose a nation to lead</h3><input class="search" placeholder="Filter…" oninput="this.nextElementSibling.querySelectorAll(\'.crow\').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(this.value.toLowerCase())?\'\':\'none\')"><div class="clist tall">'+list.map(x=>'<div class="crow" data-a="takeNation" data-v="'+x.tag+'">'+flagImg(x)+'<span><b>'+esc(x.name)+'</b><small>$'+fmtB(x.gdp)+'</small></span></div>').join("")+'</div><div class="row end"><button class="btn" data-a="closeModal">Cancel</button></div>',"wide"); }

// ---------- actions ----------
const ACT = {
  closeModal:()=>{ $("#modal").dataset.blocking=""; closeModal(); },
  speed:d=>setSpeed(+d.v),
  panel:d=>{ const [k,a]=d.v.split(":"); if (k==="country") { G.sel={type:"country",tag:a}; mapDirty(false); } if (k==="prov") { selectProv(+a); return; } openPanel(d.v); },
  closePanel:()=>closePanel(),
  pauseMenu:()=>pauseMenu(),
  focusC:d=>focusCountry(d.v),
  gotoProv:d=>{ focusProv(+d.v,10); selectProv(+d.v); },
  selArmy:d=>{ const a=G.armies.find(x=>x.id===+d.v); if (a){ focusProv(a.prov); selectArmy(a);} },
  deselect:()=>{ G.sel=null; closePanel(); },
  diplo:d=>{ const [ok,msg]=doDiplo(G.player,d.t,d.v); if (msg!=="proposal sent") notify((ok?"✔ ":"✖ ")+msg, ok?"good":"bad"); sfx(ok?"build":"click"); refreshPanel(); updateTop(); mapDirty(true); },
  declareWar:d=>{ modal('<div class="evh">⚔️ Declare war on '+esc(C[d.t].name)+'?</div><p>Their allies, defensive pacts and guarantors may join the war against you.</p><div class="row end"><button class="btn" data-a="closeModal">Cancel</button><button class="btn red" data-a="confirmWar" data-v="'+d.t+'">Declare war</button><button class="btn red" data-a="confirmWar" data-v="'+d.t+'" data-inv="1">⚔️ Declare war &amp; invade</button></div>'); },
  confirmWar:d=>{ closeModal(); const w=declareWar(G.player,d.v,{goal:"Conquest"}); if (w){ if (d.inv) { ACT.invade({v:d.v}); G.paused=false; } openPanel("war:"+w.id); } else notify("Cannot declare war on this country.","bad"); },
  peaceUI:d=>peaceUI(d.v,d.t),
  pw:()=>{ UIState.peace.white=!UIState.peace.white; renderPeace(); },
  pa:d=>{ const s=UIState.peace.annex; const id=+d.v; s.has(id)?s.delete(id):s.add(id); renderPeace(); },
  paAll:()=>{ const st=UIState.peace; for (const p of P) if (p.owner===st.t && (p.ctrl===G.player||isAlly(p.ctrl,G.player))) st.annex.add(p.id); renderPeace(); },
  pp:()=>{ UIState.peace.puppet=!UIState.peace.puppet; renderPeace(); },
  pr:()=>{ UIState.peace.rep=!UIState.peace.rep; renderPeace(); },
  prl:d=>{ const s=UIState.peace.release; s.has(d.v)?s.delete(d.v):s.add(d.v); renderPeace(); },
  sendPeace:()=>{ const st=UIState.peace; const w=G.wars.find(x=>x.id===st.w); if (!w) return closeModal(); const terms={annex:[...st.annex],puppet:st.puppet,reparations:st.rep,release:[...st.release],white:st.white};
    if (C[st.t].isPlayer || aiAcceptsPeace(w,G.player,st.t,terms)){ closeModal(); applyPeace(w,G.player,st.t,terms); closePanel(); } else { notify("✖ "+C[st.t].name+" rejected your peace terms.","bad"); C[G.player].di=Math.max(0,C[G.player].di-2); } },
  build:d=>{ const [ok,msg]=queueBuild(C[G.player],+d.p,d.v); notify((ok?"🏗️ ":"✖ ")+msg,ok?"good":"bad"); refreshPanel(); updateTop(); },
  buildSel:()=>{ const [ok,msg]=queueBuild(C[G.player],+$("#bprov").value,$("#btype").value); notify((ok?"🏗️ ":"✖ ")+msg,ok?"good":"bad"); refreshPanel(true); updateTop(); },
  cancelBuild:d=>{ const c=C[G.player]; const q=c.buildQ[+d.v]; if (q){ c.treasury+=bCost(c,q.b)*0.5; c.buildQ.splice(+d.v,1); } refreshPanel(); },
  recruit:d=>{ const n=+($("#rcount")?$("#rcount").value:1); const [ok,msg]=recruit(C[G.player],d.v,n,+d.p); notify((ok?"🪖 ":"✖ ")+msg,ok?"good":"bad"); refreshPanel(true); updateTop(); },
  research:d=>{ const c=C[G.player]; const t=TECHS[d.v]; if (c.techs[d.v]||c.research.some(r=>r&&r.id===d.v)) return; if (!t[3].every(q=>c.techs[q])) { notify("✖ Research the prerequisites first.","bad"); return; } let i=c.research.findIndex(r=>!r); if (i<0){ notify("Both research slots are busy. Cancel one first.","bad"); return; } c.research[i]={id:d.v,prog:0}; sfx("click"); refreshPanel(); },
  cancelRes:d=>{ C[G.player].research[+d.v]=null; refreshPanel(); },
  quickRecruit:d=>{ const c=C[G.player]; const pid=P[c.capital].owner===c.tag&&P[c.capital].ctrl===c.tag?c.capital:ownedProvs(c.tag).find(p=>p.ctrl===c.tag).id; const [ok,msg]=recruit(c,d.v,10,pid); notify((ok?"🪖 ":"✖ ")+msg,ok?"good":"bad"); refreshPanel(); updateTop(); },
  invade:d=>{ const pl=G.player; const t=d.v; if (t!=="all" && !atWar(pl,t)) return notify("You are not at war with "+C[t].name+".","bad"); let n=0; for (const a of G.armies){ if (a.owner!==pl||landSize(a)<0.5||a.training) continue; a.auto=t; a.path=[]; n++; } notify(n?"⚔️ "+n+" armies ordered to capture "+(t==="all"?"all enemy territory":C[t].name)+".":"You have no available land armies (training armies are excluded).",n?"war":"bad"); if (n){ sfx("war"); autoArmies.call&&G.armies.forEach((a,i)=>{ if(a.auto&&!a.battle&&!a.path.length) aiArmyOrder(a,C[pl],null,i,invadeFilter(t)); }); } refreshPanel(); mapDirty(false); },
  stopInvade:()=>{ let n=0; for (const a of G.armies) if (a.owner===G.player&&a.auto){ a.auto=null; a.path=[]; n++; } notify("⏹ Stopped "+n+" invasion orders.","info"); refreshPanel(); mapDirty(false); },
  armyInvade:(d,el)=>{ const a=G.armies.find(x=>x.id===+d.v); if (!a) return; a.auto=el.value||null; a.path=[]; if (a.auto && !a.battle) aiArmyOrder(a,C[a.owner],null,0,invadeFilter(a.auto)); refreshPanel(true); mapDirty(false); },
  train:d=>{ const a=G.armies.find(x=>x.id===+d.v); if (!a) return; const [ok,msg]=startTraining(a,d.t); notify((ok?"🎓 ":"✖ ")+msg,ok?"good":"bad"); refreshPanel(true); updateTop(); mapDirty(false); },
  armyStop:d=>{ const a=G.armies.find(x=>x.id===+d.v); if(a){ a.path=[]; a.auto=null; } refreshPanel(); mapDirty(false); },
  armySplit:d=>{ const a=G.armies.find(x=>x.id===+d.v); if(!a||a.battle) return; const half={}; let any=false; for (const k in a.units){ const h=Math.floor(a.units[k]/2); if (h>0){ half[k]=h; a.units[k]-=h; any=true; } } if (any){ const b=createArmy(a.owner,a.prov,half,null); b.org=a.org; notify("✂️ Created "+b.name,"good"); } refreshPanel(); mapDirty(false); },
  armyMerge:d=>{ const a=G.armies.find(x=>x.id===+d.v); if(!a) return; let n=0; for (const b of G.armies) if (b!==a && b.owner===a.owner && b.prov===a.prov && !b.battle){ for (const k in b.units) a.units[k]=(a.units[k]||0)+b.units[k]; b.units={}; freeGeneral(b); n++; } G.armies=G.armies.filter(x=>armySize(x)>0.05); notify(n?"🔗 Merged "+n+" armies.":"No other armies here to merge.",n?"good":"info"); refreshPanel(); mapDirty(false); },
  armyHome:d=>{ const a=G.armies.find(x=>x.id===+d.v); const c=C[G.player]; if (a && !orderMove(a,c.capital)) notify("Can't find a route home.","bad"); refreshPanel(); mapDirty(false); },
  armyDisband:d=>{ const a=G.armies.find(x=>x.id===+d.v); if(!a) return; const c=C[a.owner]; for (const k in a.units) c.manpower+=a.units[k]*UNITS[k].mp*500; freeGeneral(a); G.armies=G.armies.filter(x=>x!==a); closePanel(); mapDirty(false); },
  hireGen:()=>{ const c=C[G.player]; const cost=1+c.gdp*0.001; if (c.treasury<cost) return notify("Not enough money.","bad"); c.treasury-=cost; const trt=TRAITS[Math.floor(Math.random()*TRAITS.length)]; c.generals.push({id:G.nextId++,name:"Gen. "+SURNAMES[Math.floor(Math.random()*SURNAMES.length)],skill:1+Math.floor(Math.random()*5),trait:trt[0],tk:trt[1],tv:trt[2],army:null}); refreshPanel(); },
  loan:()=>{ const c=C[G.player]; if (c.bankrupt) return notify("Creditors refuse to lend to a bankrupt nation.","bad"); const x=c.gdp*0.05; c.treasury+=x; c.debt+=x*1.05; notify("🏦 Borrowed $"+fmtB(x),"good"); refreshPanel(); updateTop(); },
  repay:()=>{ const c=C[G.player]; const x=Math.min(c.debt,Math.max(0,c.treasury*0.9)); c.debt-=x; c.treasury-=x; notify("Repaid $"+fmtB(x),"good"); refreshPanel(); updateTop(); },
  buy:d=>{ const c=C[G.player]; const pr=G.market.price[d.v]*1.05; if (c.treasury<pr) return notify("Not enough money.","bad"); c.treasury-=pr; c.stock[d.v]=(c.stock[d.v]||0)+1; G.market.price[d.v]*=1.01; refreshPanel(); updateTop(); },
  sell:d=>{ const c=C[G.player]; if ((c.stock[d.v]||0)<1) return notify("You don't have 1 unit of "+RES_NAMES[d.v]+" to sell.","bad"); c.stock[d.v]-=1; c.treasury+=G.market.price[d.v]*0.95; G.market.price[d.v]*=0.99; refreshPanel(); updateTop(); },
  decision:d=>{ const c=C[G.player], D=DECISIONS[d.v]; const cost=D.cost(c); c.treasury-=cost; if (D.di) c.di-=D.di; D.eff(c); c.decisions[d.v]={n:((c.decisions[d.v]||{}).n||0)+1,last:G.day}; notify("📜 "+D.name+" enacted.","good"); sfx("build"); refreshPanel(); updateTop(); mapDirty(true); },
  gov:d=>{ const [ok,msg]=changeGov(C[G.player],d.v); notify((ok?"🏛️ ":"✖ ")+msg,ok?"good":"bad"); refreshPanel(); mapDirty(false); },
  form:d=>{ if (formNation(G.player,d.v)) refreshPanel(); updateTop(); },
  release:d=>{ releaseNation(d.v,G.player,true); notify("🏳️ Released "+CDATA[d.v].name+" as a puppet.","good"); closePanel(); },
  releaseFree:d=>{ releaseNation(d.v,G.player,false); notify("🏳️ Released "+CDATA[d.v].name+".","good"); closePanel(); },
  strike:d=>{ const [ok,msg]=missileStrike(C[G.player],+d.v,false); if(!ok) notify("✖ "+msg,"bad"); refreshPanel(); },
  nuke:d=>{ modal('<div class="evh">☢️ Authorize nuclear strike?</div><p>This will devastate '+esc(P[+d.v].name)+', destroy armies and buildings there, and turn the whole world against you.</p><div class="row end"><button class="btn" data-a="closeModal">Cancel</button><button class="btn red" data-a="nukeGo" data-v="'+d.v+'">Launch</button></div>'); },
  nukeGo:d=>{ closeModal(); const [ok,msg]=missileStrike(C[G.player],+d.v,true); if(!ok) notify("✖ "+msg,"bad"); refreshPanel(); },
  compare:d=>{ if (!UIState.cmp.includes(d.v)){ UIState.cmp.push(d.v); if (UIState.cmp.length>3) UIState.cmp.shift(); } openPanel("world:compare"); },
  uncompare:d=>{ UIState.cmp=UIState.cmp.filter(x=>x!==d.v); refreshPanel(); },
  rank:d=>{ UIState.rank=d.v; refreshPanel(); },
  evOpt:d=>{ const {E,data}=UIState.ev; E.opts[+d.v].f(C[G.player],data); resolvedModal(); mapDirty(true); },
  party:d=>{ PARTIES[+d.v].f(C[G.player]); C[G.player].approval+=5; notify("🗳️ "+PARTIES[+d.v].name+" forms the new government.","good"); resolvedModal(); },
  cta:d=>{ const ev=UIState.cta; const w=G.wars.find(x=>x.id===ev.war); if (w && d.v==="1") joinWar(G.player,w,w.att.includes(ev.from)?"att":"def"); else addRel(G.player,ev.from,-25); resolvedModal(); mapDirty(true); },
  prop:d=>{ const ev=UIState.prop; if (d.v==="1"){ C[ev.from].di-=DIPLO[ev.act].di; DIPLO[ev.act].run(ev.from,G.player); notify("✔ Accepted "+DIPLO[ev.act].name+" with "+C[ev.from].name,"good"); } else addRel(G.player,ev.from,-5); resolvedModal(); },
  pe:d=>{ const ev=UIState.pe; const w=G.wars.find(x=>x.id===ev.war); if (w && d.v==="1"){ if (ev.type==="peaceDemand") applyPeace(w,ev.from,G.player,{annex:ev.annex}); else if (ev.type==="peaceOffer") applyPeace(w,G.player,ev.from,{annex:ev.annex}); else applyPeace(w,G.player,ev.from,{white:true}); } resolvedModal(); },
  tax:(d,el)=>{ const c=C[G.player]; c.tax=+el.value/100; const tv=$("#taxv"); if (tv) tv.textContent=el.value+"%"; },
  law:(d,el)=>{ C[G.player].laws[d.v]=+el.value; notify("Law changed: "+LAWS[d.v].name+" → "+LAWS[d.v].opts[+el.value][0],"info"); refreshPanel(true); },
  assignGen:(d,el)=>{ const a=G.armies.find(x=>x.id===+d.v); const c=C[a.owner]; const old=generalOf(a); if (old) old.army=null; if (el.value){ const g=c.generals.find(x=>x.id===+el.value); if (g.army){ const b=G.armies.find(x=>x.id===g.army); if (b) b.general=null; } g.army=a.id; a.general=g.id; } else a.general=null; refreshPanel(true); },
  autoTrade:(d,el)=>{ G.settings.autoTrade = el.value==="1"; saveSettings(); },
  set:(d,el)=>{ let v=el.value; if (v==="true") v=true; else if (v==="false") v=false; if (G){ G.settings[d.v]=v; saveSettings(); if (d.v==="music") setMusic(v); mapDirty(true); } else { const s=loadSettings(); s[d.v]=v; try{ localStorage.setItem("wd_settings",JSON.stringify(s)); }catch(e){} } },
  dsearch:(d,el)=>{ UIState.dq=el.value; refreshPanel(true); const i=$("#dsearch"); if (i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } },
  nsearch:(d,el)=>{ const q=el.value.toLowerCase(); const r=q.length<2?[]:Object.values(C).filter(x=>x.alive&&x.name.toLowerCase().includes(q)).slice(0,8); $("#nres").innerHTML=r.map(x=>'<button class="nrb" data-a="prev" data-v="'+x.tag+'">'+flagImg(x)+esc(x.name)+'</button>').join(""); },
  prev:d=>previewNation(d.v),
  playAs:d=>beginGame(d.v),
  spectate:()=>beginGame(null),
  settings:()=>settingsModal(),
  tutorial:d=>tutorial(d.v||0),
  save:d=>{ notify(saveGame(d.v)?"💾 Game saved to slot "+d.v:"✖ Could not save (browser storage unavailable).", "good"); pauseMenu(); },
  load:d=>{ if (!WORLD_READY) return; if (!G) initGame(null); if (loadSlot(d.v)){ CHOOSING=false; $("#menu").style.display="none"; $("#play").style.display="block"; $("#play").classList.remove("choosing"); $("#topbar").style.display=""; $("#bottomnav").style.display=""; $("#selbar").innerHTML=""; resizeMap(); closeModal(); G.paused=true; $("#play").classList.toggle("spect",!G.player); if (G.player) focusCountry(G.player); else resetView(); updateTop(); notify("📂 Game loaded.","good"); } },
  export:async()=>{ const code=await exportCode(); modal('<h3>📤 Save code</h3><p class="hint">Copy this code and import it on another device to continue your campaign.</p><textarea class="code" readonly>'+code+'</textarea><div class="row end"><button class="btn" data-a="copyCode">Copy</button><button class="btn gold" data-a="closeModal">Done</button></div>',"wide"); },
  copyCode:()=>{ const t=document.querySelector("textarea.code"); try{ navigator.clipboard.writeText(t.value).then(()=>notify("Copied!","good"),()=>{ t.select(); notify("Select the text and copy it manually.","info"); }); }catch(e){ t.select(); } },
  import:()=>{ modal('<h3>📥 Import save code</h3><textarea class="code" id="impcode" placeholder="Paste a save code…"></textarea><div class="row end"><button class="btn" data-a="closeModal">Cancel</button><button class="btn gold" data-a="importGo">Load</button></div>',"wide"); },
  importGo:async()=>{ try{ if (!G) initGame(null); await importCode($("#impcode").value); CHOOSING=false; $("#menu").style.display="none"; $("#play").style.display="block"; $("#play").classList.remove("choosing"); $("#topbar").style.display=""; $("#bottomnav").style.display=""; $("#selbar").innerHTML=""; resizeMap(); closeModal(); G.paused=true; $("#play").classList.toggle("spect",!G.player); if (G.player) focusCountry(G.player); updateTop(); notify("📂 Save code loaded.","good"); }catch(e){ notify("✖ "+e.message,"bad"); } },
  switchNation:()=>switchNationModal(),
  takeNation:d=>{ $("#play").classList.remove("spect"); if (G.player && C[G.player]) C[G.player].isPlayer=false; G.player=d.v; G.spectator=false; C[d.v].isPlayer=true; closeModal(); focusCountry(d.v); selectCountry(d.v); updateTop(); notify("You now lead "+C[d.v].name+".","good"); },
  becomeSpectator:()=>{ $("#play").classList.add("spect"); if (G.player&&C[G.player]) C[G.player].isPlayer=false; G.player=null; G.spectator=true; closeModal(); G.paused=false; updateTop(); },
  toMenu:()=>{ closeModal(); closePanel(); CHOOSING=false; if (G) G.paused=true; $("#play").style.display="none"; $("#play").classList.remove("choosing"); $("#menu").style.display="flex"; renderMenu(); },
  toHub:()=>{ closeModal(); if (G) G.paused=true; location.hash="hub"; },
  newGame:()=>{ if (!WORLD_READY) return; G=null; startSelection(); },
  sandbox:()=>{ if (!WORLD_READY) return; modal('<h3>🌍 Sandbox setup</h3><label class="law"><span>AI aggression</span><select id="sbAggr"><option value="peaceful">Peaceful</option><option value="normal" selected>Normal</option><option value="aggressive">Aggressive</option></select></label><p class="hint">Sandbox games never end — there is no victory condition.</p><div class="row end"><button class="btn" data-a="closeModal">Cancel</button><button class="btn gold" data-a="sandboxGo">Choose nation ▸</button></div>'); },
  sandboxGo:()=>{ const v=$("#sbAggr").value; closeModal(); G=null; startSelection(); G.settings.aiAggr=v; },
  multiplayer:()=>{ modal('<h3>👥 Multiplayer</h3><p>Online multiplayer — several friends each leading a nation in the same live world — is planned for the next update of this game.</p><p class="muted">For now you can play the full single-player sandbox, share your campaign with a save code, or spectate the AI.</p><div class="row end"><button class="btn gold" data-a="closeModal">OK</button></div>'); },
  continueLast:()=>ACT.load({v:"auto"}),
  menuStats:()=>{ if (!G||G._preview||!G.player){ alertBox("Statistics are available inside a running game (📊 in the bottom bar)."); return; } ACT.toGame(); openPanel("world:rank"); },
  toGame:()=>{ $("#menu").style.display="none"; $("#play").style.display="block"; resizeMap(); updateTop(); },
  zin:()=>zoomAt(V.W/2,V.H/2,1.4), zout:()=>zoomAt(V.W/2,V.H/2,1/1.4), zreset:()=>{ resetView(); drawMiniViewport(); },
  home:()=>{ if (G.player) focusCountry(G.player); },
  modes:()=>{ const el=$("#modes"); el.classList.toggle("show"); },
  mode:d=>{ G.mapMode=d.v; $("#modes").classList.remove("show"); document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.v===d.v)); $("#modelabel").textContent=MODES.find(m=>m[0]===d.v)[1]; mapDirty(true); },
};
const MODES=[["political","Political"],["population","Population"],["economy","Economy"],["gdp","GDP"],["military","Military strength"],["religion","Religion"],["ideology","Government ideology"],["resource","Resources"],["diplomacy","Diplomatic relations"],["alliance","Alliances"],["infrastructure","Infrastructure"],["supply","Supply"]];
document.addEventListener("click",e=>{ const el=e.target.closest("[data-a]"); if (!el||el.tagName==="SELECT"||(el.tagName==="INPUT"&&el.type!=="checkbox")) return; const f=ACT[el.dataset.a]; if (f){ e.preventDefault(); f(el.dataset,el); } });
document.addEventListener("change",e=>{ const el=e.target.closest("[data-a]"); if (!el) return; if (el.tagName==="SELECT"||el.type==="range"){ const f=ACT[el.dataset.a]; if (f) f(el.dataset,el); } });
document.addEventListener("input",e=>{ const el=e.target; if (el.dataset && (el.dataset.a==="dsearch"||el.dataset.a==="nsearch"||el.dataset.a==="tax")){ ACT[el.dataset.a](el.dataset,el); } });
document.addEventListener("keydown",e=>{ if (!G||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return; if ($("#play").style.display==="none") return; if (e.code==="Space"){ e.preventDefault(); setSpeed(0); } else if (/^Digit[1-5]$/.test(e.code)) setSpeed(+e.code.slice(5)); else if (e.code==="Escape"){ if ($("#modal").classList.contains("show") && $("#modal").dataset.blocking!=="1") closeModal(); else closePanel(); } });

const ui = { tooltip, mapClick, rightClick, formationAnim, gameOver };

// ---------- main menu ----------
function renderMenu(){
  const auto=saveMeta("auto");
  const mb=(a,ic,t,sub,cls="")=>'<button class="mbtn '+cls+'" data-a="'+a+'"><span class="mi">'+ic+'</span><span>'+t+(sub?'<br><small>'+sub+'</small>':'')+'</span></button>';
  $("#menuBtns").innerHTML = WORLD_READY ? (
    (G && !G._preview && (G.player||G.spectator) ? mb("toGame","▶️","Resume game","","gold") : mb("newGame","⚔️","Play","Choose a nation and begin","gold"))+
    (G && !G._preview && (G.player||G.spectator) ? mb("newGame","⚔️","New game","") : "")+
    mb("sandbox","🌍","Sandbox","Set AI aggression")+
    (auto?mb("continueLast","📂","Continue",esc(auto.country)):mb("loadMenu","💾","Load game",""))+
    (auto?mb("loadMenu","💾","Load game",""):"")+
    mb("multiplayer","👥","Multiplayer","Coming soon")+
    mb("settings","⚙️","Settings","")+

function techLayout(cat){
  const ids=Object.keys(TECHS).filter(id=>TECHS[id][1]===cat); const depth={};
  const dep=id=>{ if (depth[id]!==undefined) return depth[id]; const ps=TECHS[id][3].filter(q=>TECHS[q][1]===cat); depth[id]=ps.length?1+Math.max(...ps.map(dep)):0; return depth[id]; };
  ids.forEach(dep); const pos={}; const used={};
  ids.slice().sort((a,b)=>depth[a]-depth[b]).forEach(id=>{ const col=depth[id]; used[col]=used[col]||new Set(); const ps=TECHS[id][3].filter(q=>pos[q]); let want=ps.length?Math.min(...ps.map(q=>pos[q].row)):0; while (used[col].has(want)) want++; used[col].add(want); pos[id]={col,row:want}; });
  return pos;
}
PANELS.research = ()=>{
  const c=C[G.player]; if(!c) return ["Research",""]; const rp=c.rpDay||rpPerDay(c);
  let h='<div class="slots">'+c.research.map((r,i)=> r? '<div class="slot2 on" data-a="techSel" data-v="'+r.id+'">'+ring(r.prog/TECHS[r.id][2],54,"#60a5fa",icon(TECH_ICONS[r.id],"tico"),5)+'<span><b>'+TECHS[r.id][0]+'</b><small>'+Math.ceil((TECHS[r.id][2]-r.prog)/Math.max(0.1,rp))+' days left</small></span><button class="x" data-a="cancelRes" data-v="'+i+'">✕</button></div>' : '<div class="slot2 empty"><span class="plus">＋</span><span><b>Empty slot</b><small>Tap a glowing technology</small></span></div>').join("")+'</div>';
  h+='<div class="rpline">🔬 '+rp.toFixed(1)+' research points per day · '+Object.keys(c.techs).length+'/'+Object.keys(TECHS).length+' technologies</div>';
  h+='<div class="ctabs">'+TECH_CATS.map(k=>{ const tot=Object.keys(TECHS).filter(id=>TECHS[id][1]===k); const done=tot.filter(id=>c.techs[id]).length; return '<button class="'+(UIState.tcat===k?'on':'')+'" data-a="tcat" data-v="'+k+'"><span>'+CAT_ICONS[k]+'</span><b>'+k+'</b><small>'+done+'/'+tot.length+'</small></button>'; }).join("")+'</div>';
  const pos=techLayout(UIState.tcat); const CW=128, RH=136, PADX=14, PADY=12; let maxC=0,maxR=0; for (const id in pos){ maxC=Math.max(maxC,pos[id].col); maxR=Math.max(maxR,pos[id].row); }
  const W=(maxC+1)*CW+PADX, H=(maxR+1)*RH+PADY; let lines="", nodes="";
  for (const id in pos){ const p=pos[id]; const x=PADX+p.col*CW, y=PADY+p.row*RH; const t=TECHS[id]; const done=c.techs[id]; const act=c.research.find(r=>r&&r.id===id); const avail=t[3].every(q=>c.techs[q]);
    for (const q of t[3]){ if (!pos[q]) continue; const qx=PADX+pos[q].col*CW+86, qy=PADY+pos[q].row*RH+36, tx=x, ty=y+36; lines+='<path d="M'+qx+' '+qy+' C'+(qx+24)+' '+qy+' '+(tx-24)+' '+ty+' '+tx+' '+ty+'" class="'+(c.techs[q]?'lit':'')+'"/>'; }
    const st=done?"done":act?"act":avail?"avail":"lock"; const ext=t[3].some(q=>!pos[q]);
    nodes+='<button class="tnode '+st+(UIState.tsel===id?' sel':'')+'" style="left:'+x+'px;top:'+y+'px" data-a="techSel" data-v="'+id+'"><span class="tbox">'+(act?ring(act.prog/t[2],72,"#60a5fa","",4):"")+icon(TECH_ICONS[id],"tico")+(done?'<i class="tok">✓</i>':st==="lock"?'<i class="tlk">🔒</i>':'')+(ext?'<i class="text">🔗</i>':'')+'</span><b>'+t[0]+'</b><small>'+(done?"Researched":act?Math.round(act.prog/t[2]*100)+"%":"🔬 "+t[2])+'</small></button>'; }
  const id=UIState.tsel && TECHS[UIState.tsel] ? UIState.tsel : null;
  if (id){ const t=TECHS[id]; const done=c.techs[id]; const act=c.research.find(r=>r&&r.id===id); const missing=t[3].filter(q=>!c.techs[q]);
    h+='<div class="tdetail"><span class="tbig">'+icon(TECH_ICONS[id],"tico")+'</span><div><b>'+t[0]+'</b><p>'+t[4]+'</p><small>'+CAT_ICONS[t[1]]+' '+t[1]+' · 🔬 '+t[2]+' points · about '+Math.ceil(t[2]/Math.max(0.1,rp))+' days</small>'+(missing.length?'<div class="chips sm">'+missing.map(q=>'<span class="chip red" data-a="techSel" data-v="'+q+'">🔒 needs '+TECHS[q][0]+'</span>').join("")+'</div>':'')+'</div>'+
      (done?'<span class="pill green">✓ Done</span>':act?'<span class="pill blue">Researching</span>':missing.length?'':'<button class="btn gold big" data-a="research" data-v="'+id+'">🔬 Research</button>')+'</div>'; }
  else h+='<div class="tdetail hintd">👆 Tap a technology to see what it does. <b>Glowing</b> ones are ready; lines show what unlocks what.</div>';
  h+='<div class="treewrap"><div class="tree" style="width:'+W+'px;height:'+H+'px"><svg width="'+W+'" height="'+H+'">'+lines+'</svg>'+nodes+'</div></div>';
  return ["🔬 Research",h];
};

  if (!list.length) h+='<p class="muted">No countries here.</p>';

const MP={role:null,peer:null,players:{},myId:null,myTag:null,name:"",code:"",started:false,queue:[],answered:new Set(),shown:new Set(),lastLight:0,lastFull:0,lastHist:0,forceFull:false,chat:[],hostConn:null,timer:null};
let REMOTE=false, REMOTE_NOTES=null;
function MPClient(){ return MP.role==="client" && MP.started; }
function MPHost(){ return MP.role==="host" && MP.started; }
const PEER_URL="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
const CODE_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newCode(){ let s=""; for (let i=0;i<5;i++) s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)]; return s; }
function peerIdFor(code){ return "wdhub-"+code.toLowerCase(); }

// ---------- remote execution guards (host runs a friend's command without touching its own screen) ----------
(function(){
  for (const name of ["openPanel","closePanel","refreshPanel","modal","closeModal","updateTop","focusProv","focusCountry","selectProv","selectArmy","selectCountry","resolvedModal","sfx","pauseMenu","renderPeace"]){
    const orig=window[name]; if (typeof orig!=="function") continue;
    window[name]=function(){ if (REMOTE) return; return orig.apply(this,arguments); };
  }
  const n0=window.notify; window.notify=function(msg,type,pid){ if (REMOTE){ REMOTE_NOTES && REMOTE_NOTES.push([msg,type||"info",pid]); return; } return n0(msg,type,pid); };
  const fa=ui.formationAnim; ui.formationAnim=function(c,f){ if (REMOTE) return; return fa(c,f); };
})();
function runAs(tag, fn, uiState){
  const prevP=G.player, prevUI={batch:UIState.batch,bprov:UIState.bprov,peace:UIState.peace,ev:UIState.ev,cta:UIState.cta,prop:UIState.prop,pe:UIState.pe};
  G.player=tag; REMOTE=true; REMOTE_NOTES=[];
  if (uiState) Object.assign(UIState, uiState);
  try { fn(); } catch(e){ console.error(e); REMOTE_NOTES.push(["✖ "+e.message,"bad"]); }
  finally { G.player=prevP; REMOTE=false; Object.assign(UIState, prevUI); }
  const n=REMOTE_NOTES; REMOTE_NOTES=null; MP.forceFull=true; mapDirty(true); return n;
}

// ---------- compression ----------
async function gz(obj){ const s=JSON.stringify(obj); if (!window.CompressionStream) return {j:s}; const cs=new Blob([s]).stream().pipeThrough(new CompressionStream("gzip")); return {z:new Uint8Array(await new Response(cs).arrayBuffer())}; }
async function ungz(m){ if (m.j!==undefined) return JSON.parse(m.j); const u=m.z instanceof Uint8Array?m.z:new Uint8Array(m.z); const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip")); return JSON.parse(await new Response(ds).text()); }

// ---------- networking ----------
async function mpLoadPeer(){ if (window.Peer) return; await loadScript(PEER_URL,15000); if (!window.Peer) throw new Error("PeerJS failed to load"); }
function mpOpenPeer(id){ return new Promise((res,rej)=>{ let done=false; const p=id? new Peer(id,{debug:1}) : new Peer({debug:1});
  const t=setTimeout(()=>{ if(!done){ done=true; try{p.destroy();}catch(e){} rej(new Error("Could not reach the multiplayer server.")); } },14000);
  p.on("open",()=>{ if(done) return; done=true; clearTimeout(t); res(p); });
  p.on("error",e=>{ if(done) { mpPeerError(e); return; } done=true; clearTimeout(t); rej(e); }); }); }
function mpPeerError(e){ console.warn("peer error",e); if (MP.role==="client" && e && e.type==="peer-unavailable") mpFail("No game found with code "+MP.code+". Check the code and try again."); }
function send(conn,msg){ try{ if (conn && conn.open) conn.send(msg); }catch(e){ console.warn(e); } }
function mpSend(msg){ if (MP.role==="client") send(MP.hostConn,msg); }
function broadcast(msg, except){ for (const id in MP.players){ const pl=MP.players[id]; if (pl.conn && id!==except) send(pl.conn,msg); } }
function mpFail(msg){ modal('<div class="evh">👥 Multiplayer</div><p>'+esc(msg)+'</p><p class="hint">Multiplayer connects players directly through the internet (WebRTC). It works on the public version of this website. Inside claude.ai it is blocked, and some school/office networks block it too.</p><div class="row end"><button class="btn gold" data-a="closeModal">OK</button></div>'); }

    MP.peer=p; MP.role="host"; MP.myId="host"; MP.started=false; MP.players={host:{name:MP.name,tag:null,host:true,conn:null}};
    p.on("connection",conn=>hostOnConn(conn)); p.on("disconnected",()=>{ try{ p.reconnect(); }catch(e){} });

  try { await mpLoadPeer(); const p=await mpOpenPeer(null); MP.peer=p; MP.role="client"; MP.started=false; MP.myId=p.id;
    const conn=p.connect(peerIdFor(code),{reliable:true}); MP.hostConn=conn;
    const t=setTimeout(()=>{ if(!conn.open) mpFail("Could not connect to the host. They may have left, or your network blocks peer-to-peer connections."); },15000);
    conn.on("open",()=>{ clearTimeout(t); send(conn,{t:"hello",name:MP.name,map:MAP_ID,np:P.length}); });
    conn.on("data",d=>clientOnData(d)); conn.on("close",()=>clientLost());
